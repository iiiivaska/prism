name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps a conclusive result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Exact Xcode for the apple job (ADR-0003 floor is 26.4): the Xcode the Phase 1 Apple checks were
  # verified with (tools/tokens/ARCHITECTURE.md §15, V1). SwiftUI snapshot baselines (P3-3) compare
  # byte-for-byte only when recorded with this same Xcode, so record them with it and move the pin and
  # the baselines together; a newer local Xcode is the roadmap's Xcode 27 lane, not a reason to re-pin.
  XCODE_VERSION: "26.6"

# Steps whose tool or ticket has not landed are skipped, not failed: the `plan` job tests for the
# file each one needs and later steps read its outputs. A gate opens by itself in the commit that
# adds the file; each gated step names the roadmap ticket (docs/roadmap.md) that activates it.
# The Phase 1 gate files are those of tools/tokens/ARCHITECTURE.md §3 and §14: never create one
# before its ticket is complete.

jobs:
  plan:
    name: Plan gated steps
    runs-on: ubuntu-latest
    outputs:
      tokens_lint: ${{ steps.gates.outputs.tokens_lint }}
      tokens_normalize: ${{ steps.gates.outputs.tokens_normalize }}
      tokens_build: ${{ steps.gates.outputs.tokens_build }}
      xcassets: ${{ steps.gates.outputs.xcassets }}
      catalog_tests: ${{ steps.gates.outputs.catalog_tests }}
      dstokens_scheme: ${{ steps.gates.outputs.dstokens_scheme }}
      dscore_tests: ${{ steps.gates.outputs.dscore_tests }}
      dscore_scheme: ${{ steps.gates.outputs.dscore_scheme }}
      contrast: ${{ steps.gates.outputs.contrast }}
      tokens_diff: ${{ steps.gates.outputs.tokens_diff }}
      font_root: ${{ steps.gates.outputs.font_root }}
      fonts_check: ${{ steps.gates.outputs.fonts_check }}
      spec: ${{ steps.gates.outputs.spec }}
      icons: ${{ steps.gates.outputs.icons }}
      icons_apple: ${{ steps.gates.outputs.icons_apple }}
      parity: ${{ steps.gates.outputs.parity }}
      licenses: ${{ steps.gates.outputs.licenses }}
      licenses_notices: ${{ steps.gates.outputs.licenses_notices }}
      gallery: ${{ steps.gates.outputs.gallery }}
      vrt: ${{ steps.gates.outputs.vrt }}
      snapshots: ${{ steps.gates.outputs.snapshots }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect landed tools
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Gated CI steps"
            echo
            echo "| Gate | Ticket | Opens when | Live |"
            echo "|------|--------|------------|------|"
          } >> "$GITHUB_STEP_SUMMARY"
          emit() { # emit <output> <ticket> <condition> <true|false>
            echo "$1=$4" >> "$GITHUB_OUTPUT"
            echo "| \`$1\` | $2 | $3 | $4 |" >> "$GITHUB_STEP_SUMMARY"
          }
          gate() { # gate <output> <ticket> <path>
            if [ -e "$3" ]; then emit "$1" "$2" "\`$3\` exists" true; else emit "$1" "$2" "\`$3\` exists" false; fi
          }
          gate tokens_lint      P1-2 tools/tokens/terrazzo.config.ts
          gate tokens_normalize P1-4 tools/tokens/normalize.ts
          gate tokens_build     P1-5 tools/tokens/build.ts
          gate xcassets         P1-5 tools/tokens/scripts/verify-xcassets.sh
          gate catalog_tests    P1-5 swift/Tests/DSTokensTests/ColorCatalogTests.swift
          gate dstokens_scheme  P1-5 .swiftpm/xcode/xcshareddata/xcschemes/DSTokensTests.xcscheme
          gate dscore_tests     P3-1 swift/Tests/DSCoreTests/DSFontRegistrationTests.swift
          gate dscore_scheme    P3-1 .swiftpm/xcode/xcshareddata/xcschemes/DSCoreTests.xcscheme
          gate contrast         P1-6 tools/contrast/check.ts
          gate tokens_diff      P1-7 tools/tokens/diff.ts
          gate font_root        P1-8 tools/tokens/formats/fonts.ts
          gate fonts_check      P1-8 tools/fonts/check.ts
          gate spec             P2-1 tools/spec/validate.ts
          gate icons            P2-2 tools/icons/validate.ts
          gate icons_apple      P2-2 tools/icons-apple/Package.swift
          gate parity           P2-3 tools/parity/report.ts
          gate licenses         P2-4 tools/licenses/check.ts
          gate licenses_notices P2-4 tools/licenses/notices.ts
          gate gallery          P3-4 web/apps/gallery/.storybook/main.ts
          gate vrt              P3-4 web/apps/vrt/playwright.config.ts
          # SwiftUI snapshot tests run once the first baselines are recorded next to them.
          if [ -n "$(find swift/Tests/DSSnapshotTests/__Snapshots__ -type f ! -name .gitkeep -print -quit 2>/dev/null)" ]; then
            emit snapshots P3-3 "a baseline under \`swift/Tests/DSSnapshotTests/__Snapshots__\`" true
          else
            emit snapshots P3-3 "a baseline under \`swift/Tests/DSSnapshotTests/__Snapshots__\`" false
          fi

  contracts:
    name: Tokens, specs, registries
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tokens:diff (P1-7) compares against the last tag
      - uses: pnpm/setup@v2.1.0 # pnpm from packageManager, Node 24 (.node-version), pnpm install --frozen-lockfile
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Validate token files against the vendored DTCG 2025.10 schemas
        # Offline and ungated (ADR-0024 §10): tools/tokens/validate.ts checks the vendored bytes in
        # tools/tokens/schema/dtcg-2025.10 against their SHA256SUMS before it validates.
        run: pnpm --filter @iiiivaska/prism-tools tokens:validate
      - name: No literal colors, dimensions or font names outside tokens
        run: pnpm --filter @iiiivaska/prism-tools lint:literals
      - name: No reference UI copy in contracts, samples or renders
        run: pnpm --filter @iiiivaska/prism-tools lint:reference-copy
      - name: Lint tokens (Terrazzo, naming, orthogonality) # P1-2
        if: needs.plan.outputs.tokens_lint == 'true'
        run: pnpm --filter @iiiivaska/prism-tools tokens:lint
      - name: Authored hex and spring fallbacks equal the normalizer's # P1-4
        # tokens:build runs the same check first from P1-5 on (ARCHITECTURE §7.13).
        if: needs.plan.outputs.tokens_normalize == 'true'
        run: pnpm --filter @iiiivaska/prism-tools tokens:normalize:check
      - name: Build tokens and fail on stale generated output # P1-5; P1-8 adds the Swift font root
        if: needs.plan.outputs.tokens_build == 'true'
        env:
          FONT_ROOT: ${{ needs.plan.outputs.font_root }}
        run: |
          pnpm --filter @iiiivaska/prism-tools tokens:build
          # The owned roots, equal to OWNED_ROOTS in tools/tokens/config.ts (ARCHITECTURE §9.0,
          # ADR-0024 §11); tools/tokens/output/roots.test.ts asserts the equality.
          generated="swift/Sources/DSTokens/Generated swift/Sources/DSTokens/Resources/Colors.xcassets swift/Tests/DSTokensTests/Generated web/packages/tokens/src/generated tokens/export"
          # P1-8 (ADR-0021 §11): the sixth root, once tokens:build emits fonts (tools/tokens/formats/fonts.ts).
          if [ "$FONT_ROOT" = true ]; then generated="$generated swift/Sources/DSTokens/Resources/Fonts"; fi
          # git status also catches new files that git diff would miss.
          if [ -n "$(git status --porcelain -- $generated)" ]; then
            git status --short -- $generated
            git diff -- $generated
            echo "::error::Generated token output is stale: run pnpm tokens:build and commit the result."
            exit 1
          fi
      - name: Contrast test for every brand and scheme # P1-6
        if: needs.plan.outputs.contrast == 'true'
        run: pnpm --filter @iiiivaska/prism-tools contrast:check
      - name: Classify token changes against the declared changeset # P1-7
        if: needs.plan.outputs.tokens_diff == 'true' && github.event_name == 'pull_request'
        run: pnpm --filter @iiiivaska/prism-tools tokens:diff
      - name: Check brand font files, versions, Cyrillic, tabular digits and the DSTokens budget # P1-8
        if: needs.plan.outputs.fonts_check == 'true'
        run: pnpm --filter @iiiivaska/prism-tools fonts:check
      - name: Validate specs against JSON Schema # P2-1
        if: needs.plan.outputs.spec == 'true'
        run: pnpm --filter @iiiivaska/prism-tools spec:validate
      - name: Validate icon registry against Phosphor catalog # P2-2
        if: needs.plan.outputs.icons == 'true'
        run: pnpm --filter @iiiivaska/prism-tools icons:validate
      - name: License inventory gate # P2-4
        # The ledger validates, no packaged item carries a license that forbids it, and the inventory
        # matches the files the repository packages and the dependencies its packages declare.
        if: needs.plan.outputs.licenses == 'true'
        run: pnpm --filter @iiiivaska/prism-tools licenses:check
      - name: Third-party notices are regenerated from the inventory # P2-4
        if: needs.plan.outputs.licenses_notices == 'true'
        run: pnpm --filter @iiiivaska/prism-tools licenses:notices --check
      - name: Parity report # P2-3
        # The writing mode, so the artifact below is this run's report, and then the stale guard of the
        # tokens step above: `--check` after a write would always pass. tools/parity/report.test.ts
        # ("the committed report is what this run renders") asserts the same thing in the `web` job.
        if: needs.plan.outputs.parity == 'true'
        run: |
          # ADR-0006 rule 3: lag is an error on main; on branches the report is informational.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            pnpm --filter @iiiivaska/prism-tools parity:report --fail-on-lag
          else
            pnpm --filter @iiiivaska/prism-tools parity:report
          fi
          # git status also catches a report that was never committed, which git diff would miss.
          if [ -n "$(git status --porcelain -- tools/parity/report.md)" ]; then
            git status --short -- tools/parity/report.md
            git diff -- tools/parity/report.md
            echo "::error::tools/parity/report.md is stale: run pnpm parity:report and commit the result."
            exit 1
          fi
      - name: Upload parity report # P2-3
        if: needs.plan.outputs.parity == 'true' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: parity-report
          path: tools/parity/report.md

  web:
    name: Web and tools (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    needs: [plan, contracts]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.1.0 # pnpm from packageManager, Node 24 (.node-version), pnpm install --frozen-lockfile
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build every workspace package
        # web/apps/gallery prints a placeholder until P3-4, which makes this `storybook build`.
        run: pnpm -r build
      - name: Install Chromium for Storybook tests in Vitest browser mode # P3-4
        if: needs.plan.outputs.gallery == 'true'
        run: pnpm --filter @iiiivaska/prism-gallery exec playwright install --with-deps chromium
      - name: Unit, component and a11y tests
        # From P3-4 the gallery runs its stories as Vitest browser-mode and a11y tests here.
        # Visual regression runs only in web-vrt, inside the pinned Playwright image.
        run: pnpm -r --filter '!@iiiivaska/prism-vrt' test
      - name: Upload static Storybook for visual regression # P3-4
        if: needs.plan.outputs.gallery == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: web/apps/gallery/storybook-static
          if-no-files-found: error

  web-vrt:
    name: Web visual regression
    runs-on: ubuntu-latest
    needs: [plan, web]
    # P3-4: runs once the Playwright suite and the Storybook it screenshots have landed.
    if: needs.plan.outputs.vrt == 'true' && needs.plan.outputs.gallery == 'true'
    container:
      # Keep the tag equal to the @playwright/test version in pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: web/apps/gallery/storybook-static
      - uses: pnpm/setup@v2.1.0 # pnpm from packageManager, Node 24 (.node-version), pnpm install --frozen-lockfile
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Screenshot every story tagged vrt across scheme × density × viewport
        run: pnpm --filter @iiiivaska/prism-vrt test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vrt-diffs
          path: web/apps/vrt/test-results

  apple:
    name: Swift package
    runs-on: macos-26
    needs: [plan, contracts]
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "::error::Xcode $XCODE_VERSION is not installed on this runner image. Installed:"
            ls -d /Applications/Xcode_*.app
            exit 1
          fi
          app="$(cd "$app" && pwd -P)" # resolve alias symlinks such as Xcode_26.6.0.app
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
      - run: xcodebuild -version && swift --version
      - name: Validate SF Symbol names at minimum OS # P2-2
        if: needs.plan.outputs.icons_apple == 'true'
        run: swift run --package-path tools/icons-apple icons-validate spec/icons/registry.json
      - name: Build and test (macOS host)
        run: |
          swift build
          swift test
      - name: Build for iOS Simulator and watchOS Simulator
        run: |
          xcodebuild build -scheme Prism-Package -destination 'generic/platform=iOS Simulator'
          xcodebuild build -scheme Prism-Package -destination 'generic/platform=watchOS Simulator'
      - name: Compile the color catalog for iOS, macOS and watchOS and check its entries # P1-5
        if: needs.plan.outputs.tokens_build == 'true' && needs.plan.outputs.xcassets == 'true'
        run: bash tools/tokens/scripts/verify-xcassets.sh
      - name: DSTokens catalog tests on the iOS Simulator # P1-5
        if: needs.plan.outputs.tokens_build == 'true' && needs.plan.outputs.catalog_tests == 'true'
        run: xcodebuild test -scheme Prism-Package -only-testing:DSTokensTests -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
      - name: DSTokens catalog tests on the watchOS Simulator # P1-5
        # ARCHITECTURE V1, checked 2026-09-15 with Xcode 26.6: Prism-Package cannot test on watchOS, because
        # its test action also builds DSSnapshotTests and SnapshotTesting 1.19.4 does not compile for watchOS
        # ("cannot find 'Image' in scope"). This step therefore runs the shared scheme DSTokensTests
        # (.swiftpm/xcode/xcshareddata/xcschemes/DSTokensTests.xcscheme), which builds DSTokens and tests only DSTokensTests.
        if: needs.plan.outputs.tokens_build == 'true' && needs.plan.outputs.catalog_tests == 'true' && needs.plan.outputs.dstokens_scheme == 'true'
        run: xcodebuild test -scheme DSTokensTests -destination 'platform=watchOS Simulator,name=Apple Watch Series 11 (46mm),OS=latest'
      - name: DSCore tests on the iOS Simulator # P3-1
        # ADR-0021 rule 7 asks for the font registration and the rendering checks on the iOS and watchOS
        # simulators as well as the host, and ADR-0019 rule 12 for the mapping over the iOS `platformDefault`
        # (regular, touch).
        if: needs.plan.outputs.dscore_tests == 'true'
        run: xcodebuild test -scheme Prism-Package -only-testing:DSCoreTests -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
      - name: DSCore tests on the watchOS Simulator # P3-1
        # ADR-0021 rule 7: the same suite on watchOS, which is also the only place `DSPlatform.isWatch` and
        # `fixesColorSchemeToDark` are true in a real build, so the watch rows of the surface table and the
        # watch hero role are exercised for real and not only through the injected parameters. It runs the
        # shared scheme DSCoreTests (.swiftpm/xcode/xcshareddata/xcschemes/DSCoreTests.xcscheme) for the reason
        # the DSTokens watchOS step above gives: Prism-Package's test action also builds DSSnapshotTests, whose
        # SnapshotTesting does not compile for watchOS (ARCHITECTURE V1).
        if: needs.plan.outputs.dscore_tests == 'true' && needs.plan.outputs.dscore_scheme == 'true'
        run: xcodebuild test -scheme DSCoreTests -destination 'platform=watchOS Simulator,name=Apple Watch Series 11 (46mm),OS=latest'
      - name: Gallery snapshots (SwiftUI) # P3-3
        if: needs.plan.outputs.snapshots == 'true'
        run: xcodebuild test -scheme Prism-Package -only-testing:DSSnapshotTests -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
      - name: Upload SwiftUI snapshots # P3-5
        if: needs.plan.outputs.snapshots == 'true' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-apple
          path: gallery/snapshots/**/*.apple.*.png
