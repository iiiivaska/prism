name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      # The two re-records, one per stack, each named `update-` and the artifact it hands back. Each is the one
      # sanctioned way to change a committed baseline of its stack on purpose: a comparing run never writes over
      # a committed baseline, and .github/scripts/baseline-handback.sh refuses one written over or deleted and
      # recorded again. Only a person's dispatch reaches them: push and pull_request carry no inputs, a dispatch
      # leaves both off unless someone turns one on, and no workflow of this repository dispatches this one.
      update-vrt-baselines:
        # P3-4: web-vrt records new Linux baselines instead of comparing, uploads them as the
        # `vrt-baselines` artifact and fails, so that someone commits them.
        description: Record the web visual regression baselines in the Playwright image
        type: boolean
        default: false
      update-snapshot-baselines-apple:
        # P3-3, the twin of the input above, added ahead of P4-2 (whose glyph path moves committed Button and Card
        # baselines on purpose): the apple job records every SwiftUI baseline with XCODE_VERSION on the pinned
        # simulator instead of comparing, uploads the whole __Snapshots__ folder as the `snapshot-baselines-apple`
        # artifact and fails, so that someone reviews what moved and commits it.
        description: Record the SwiftUI snapshot baselines with the pinned Xcode and simulator
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps a conclusive result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Exact Xcode for the apple job (ADR-0003 floor is 26.4): the Xcode the Phase 1 Apple checks were
  # verified with (tools/tokens/ARCHITECTURE.md §15, V1). SwiftUI snapshot baselines (P3-3) compare
  # byte-for-byte only when recorded with this same Xcode, so record them with it and move the pin and
  # the baselines together; a newer local Xcode is the roadmap's Xcode 27 lane, not a reason to re-pin.
  XCODE_VERSION: "26.6"

# Steps whose tool or ticket has not landed are skipped, not failed: the `plan` job tests for the
# file each one needs and later steps read its outputs. A gate opens by itself in the commit that
# adds the file; each gated step names the roadmap ticket (docs/roadmap.md) that activates it.
# The Phase 1 gate files are those of tools/tokens/ARCHITECTURE.md §3 and §14: never create one
# before its ticket is complete.

jobs:
  plan:
    name: Plan gated steps
    runs-on: ubuntu-latest
    outputs:
      tokens_lint: ${{ steps.gates.outputs.tokens_lint }}
      tokens_normalize: ${{ steps.gates.outputs.tokens_normalize }}
      tokens_build: ${{ steps.gates.outputs.tokens_build }}
      xcassets: ${{ steps.gates.outputs.xcassets }}
      catalog_tests: ${{ steps.gates.outputs.catalog_tests }}
      dstokens_scheme: ${{ steps.gates.outputs.dstokens_scheme }}
      dscore_tests: ${{ steps.gates.outputs.dscore_tests }}
      dscore_scheme: ${{ steps.gates.outputs.dscore_scheme }}
      contrast: ${{ steps.gates.outputs.contrast }}
      tokens_diff: ${{ steps.gates.outputs.tokens_diff }}
      font_root: ${{ steps.gates.outputs.font_root }}
      fonts_check: ${{ steps.gates.outputs.fonts_check }}
      spec: ${{ steps.gates.outputs.spec }}
      icons: ${{ steps.gates.outputs.icons }}
      icons_apple: ${{ steps.gates.outputs.icons_apple }}
      parity: ${{ steps.gates.outputs.parity }}
      licenses: ${{ steps.gates.outputs.licenses }}
      licenses_notices: ${{ steps.gates.outputs.licenses_notices }}
      gallery: ${{ steps.gates.outputs.gallery }}
      gallery_pairs: ${{ steps.gates.outputs.gallery_pairs }}
      vrt: ${{ steps.gates.outputs.vrt }}
      snapshots: ${{ steps.gates.outputs.snapshots }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect landed tools
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Gated CI steps"
            echo
            echo "| Gate | Ticket | Opens when | Live |"
            echo "|------|--------|------------|------|"
          } >> "$GITHUB_STEP_SUMMARY"
          emit() { # emit <output> <ticket> <condition> <true|false>
            echo "$1=$4" >> "$GITHUB_OUTPUT"
            echo "| \`$1\` | $2 | $3 | $4 |" >> "$GITHUB_STEP_SUMMARY"
          }
          gate() { # gate <output> <ticket> <path>
            if [ -e "$3" ]; then emit "$1" "$2" "\`$3\` exists" true; else emit "$1" "$2" "\`$3\` exists" false; fi
          }
          gate tokens_lint      P1-2 tools/tokens/terrazzo.config.ts
          gate tokens_normalize P1-4 tools/tokens/normalize.ts
          gate tokens_build     P1-5 tools/tokens/build.ts
          gate xcassets         P1-5 tools/tokens/scripts/verify-xcassets.sh
          gate catalog_tests    P1-5 swift/Tests/DSTokensTests/ColorCatalogTests.swift
          gate dstokens_scheme  P1-5 .swiftpm/xcode/xcshareddata/xcschemes/DSTokensTests.xcscheme
          gate dscore_tests     P3-1 swift/Tests/DSCoreTests/DSFontRegistrationTests.swift
          gate dscore_scheme    P3-1 .swiftpm/xcode/xcshareddata/xcschemes/DSCoreTests.xcscheme
          gate contrast         P1-6 tools/contrast/check.ts
          gate tokens_diff      P1-7 tools/tokens/diff.ts
          gate font_root        P1-8 tools/tokens/formats/fonts.ts
          gate fonts_check      P1-8 tools/fonts/check.ts
          gate spec             P2-1 tools/spec/validate.ts
          gate icons            P2-2 tools/icons/validate.ts
          gate icons_apple      P2-2 tools/icons-apple/Package.swift
          gate parity           P2-3 tools/parity/report.ts
          gate licenses         P2-4 tools/licenses/check.ts
          gate licenses_notices P2-4 tools/licenses/notices.ts
          gate gallery          P3-4 web/apps/gallery/.storybook/main.ts
          gate gallery_pairs    P3-5 tools/gallery/build.ts
          gate vrt              P3-4 web/apps/vrt/playwright.config.ts
          # SwiftUI snapshot tests run once the first baselines are recorded next to them.
          if [ -n "$(find swift/Tests/DSSnapshotTests/__Snapshots__ -type f ! -name .gitkeep -print -quit 2>/dev/null)" ]; then
            emit snapshots P3-3 "a baseline under \`swift/Tests/DSSnapshotTests/__Snapshots__\`" true
          else
            emit snapshots P3-3 "a baseline under \`swift/Tests/DSSnapshotTests/__Snapshots__\`" false
          fi

  contracts:
    name: Tokens, specs, registries
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tokens:diff (P1-7) compares against the last tag
      - uses: pnpm/setup@v2.1.0 # pnpm from packageManager, Node 24 (.node-version), pnpm install --frozen-lockfile
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Validate token files against the vendored DTCG 2025.10 schemas
        # Offline and ungated (ADR-0024 §10): tools/tokens/validate.ts checks the vendored bytes in
        # tools/tokens/schema/dtcg-2025.10 against their SHA256SUMS before it validates.
        run: pnpm --filter @iiiivaska/prism-tools tokens:validate
      - name: No literal colors, dimensions or font names outside tokens
        run: pnpm --filter @iiiivaska/prism-tools lint:literals
      - name: No reference UI copy in contracts, samples or renders
        run: pnpm --filter @iiiivaska/prism-tools lint:reference-copy
      - name: Lint tokens (Terrazzo, naming, orthogonality) # P1-2
        if: needs.plan.outputs.tokens_lint == 'true'
        run: pnpm --filter @iiiivaska/prism-tools tokens:lint
      - name: Authored hex and spring fallbacks equal the normalizer's # P1-4
        # tokens:build runs the same check first from P1-5 on (ARCHITECTURE §7.13).
        if: needs.plan.outputs.tokens_normalize == 'true'
        run: pnpm --filter @iiiivaska/prism-tools tokens:normalize:check
      - name: Build tokens and fail on stale generated output # P1-5; P1-8 adds the Swift font root
        if: needs.plan.outputs.tokens_build == 'true'
        env:
          FONT_ROOT: ${{ needs.plan.outputs.font_root }}
        run: |
          pnpm --filter @iiiivaska/prism-tools tokens:build
          # The owned roots, equal to OWNED_ROOTS in tools/tokens/config.ts (ARCHITECTURE §9.0,
          # ADR-0024 §11); tools/tokens/output/roots.test.ts asserts the equality.
          generated="swift/Sources/DSTokens/Generated swift/Sources/DSTokens/Resources/Colors.xcassets swift/Tests/DSTokensTests/Generated web/packages/tokens/src/generated tokens/export"
          # P1-8 (ADR-0021 §11): the sixth root, once tokens:build emits fonts (tools/tokens/formats/fonts.ts).
          if [ "$FONT_ROOT" = true ]; then generated="$generated swift/Sources/DSTokens/Resources/Fonts"; fi
          # git status also catches new files that git diff would miss.
          if [ -n "$(git status --porcelain -- $generated)" ]; then
            git status --short -- $generated
            git diff -- $generated
            echo "::error::Generated token output is stale: run pnpm tokens:build and commit the result."
            exit 1
          fi
      - name: Contrast test for every brand and scheme # P1-6
        if: needs.plan.outputs.contrast == 'true'
        run: pnpm --filter @iiiivaska/prism-tools contrast:check
      - name: Classify token changes against the declared changeset # P1-7
        if: needs.plan.outputs.tokens_diff == 'true' && github.event_name == 'pull_request'
        run: pnpm --filter @iiiivaska/prism-tools tokens:diff
      - name: Check brand font files, versions, Cyrillic, tabular digits and the DSTokens budget # P1-8
        if: needs.plan.outputs.fonts_check == 'true'
        run: pnpm --filter @iiiivaska/prism-tools fonts:check
      - name: Validate specs against JSON Schema # P2-1
        if: needs.plan.outputs.spec == 'true'
        run: pnpm --filter @iiiivaska/prism-tools spec:validate
      - name: Validate icon registry against Phosphor catalog # P2-2
        if: needs.plan.outputs.icons == 'true'
        run: pnpm --filter @iiiivaska/prism-tools icons:validate
      - name: License inventory gate # P2-4
        # The ledger validates, no packaged item carries a license that forbids it, and the inventory
        # matches the files the repository packages and the dependencies its packages declare.
        if: needs.plan.outputs.licenses == 'true'
        run: pnpm --filter @iiiivaska/prism-tools licenses:check
      - name: Third-party notices are regenerated from the inventory # P2-4
        if: needs.plan.outputs.licenses_notices == 'true'
        run: pnpm --filter @iiiivaska/prism-tools licenses:notices --check
      - name: Parity report # P2-3
        # The writing mode, so the artifact below is this run's report, and then the stale guard of the
        # tokens step above: `--check` after a write would always pass. tools/parity/report.test.ts
        # ("the committed report is what this run renders") asserts the same thing in the `web` job.
        if: needs.plan.outputs.parity == 'true'
        run: |
          # ADR-0006 rule 3: lag is an error on main; on branches the report is informational.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            pnpm --filter @iiiivaska/prism-tools parity:report --fail-on-lag
          else
            pnpm --filter @iiiivaska/prism-tools parity:report
          fi
          # git status also catches a report that was never committed, which git diff would miss.
          if [ -n "$(git status --porcelain -- tools/parity/report.md)" ]; then
            git status --short -- tools/parity/report.md
            git diff -- tools/parity/report.md
            echo "::error::tools/parity/report.md is stale: run pnpm parity:report and commit the result."
            exit 1
          fi
      - name: Upload parity report # P2-3
        if: needs.plan.outputs.parity == 'true' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: parity-report
          path: tools/parity/report.md
      - name: Gallery pairs # P3-5
        # Pairs both stacks' committed snapshots by name into gallery/, so this needs neither Xcode nor a
        # browser: the Apple baselines (swift/Tests/DSSnapshotTests/__Snapshots__) and the Linux web
        # baselines (web/apps/vrt/baselines/linux) are in the checkout. The writing mode first, so the
        # artifact below is this run's page, and then the stale guard the tokens and parity steps use.
        # The collected copies are gitignored; gallery/index.html and gallery/index.json are committed.
        if: needs.plan.outputs.gallery_pairs == 'true'
        run: |
          pnpm --filter @iiiivaska/prism-tools gallery:build
          # git status also catches an index that was never committed, which git diff would miss.
          if [ -n "$(git status --porcelain -- gallery)" ]; then
            git status --short -- gallery
            git diff -- gallery
            echo "::error::The gallery index is stale: run pnpm gallery:build and commit gallery/index.html and gallery/index.json."
            exit 1
          fi
      - name: Upload the gallery # P3-5
        # The whole page in one artifact: index.html, index.json and both stacks' images beside it, so a
        # reviewer downloads it and opens index.html (ADR-0005: the gallery is the living canon).
        if: needs.plan.outputs.gallery_pairs == 'true' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: gallery
          path: gallery
          if-no-files-found: error

  web:
    name: Web and tools (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    needs: [plan, contracts]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.1.0 # pnpm from packageManager, Node 24 (.node-version), pnpm install --frozen-lockfile
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Build every workspace package
        # First: from P3-4 the react package, the gallery and their lint and type checks resolve the
        # workspace packages through their export maps, which point at dist/. web/apps/gallery runs
        # `storybook build` into storybook-static/.
        # From P3-7 this is also where the web showcase is built, on Linux: pnpm orders the workspace
        # topologically, so web/apps/showcase builds last, against the export maps of the packages this
        # step has just built. That is the whole CI cost of the web app — it stops the build here the
        # moment it no longer compiles against them, and it needs no browser and no second build.
        run: pnpm -r build
      - name: The web showcase was in that build # P3-7
        # `pnpm -r build` covers the showcase by construction, and this asserts it stayed covered: a filter
        # or a workspace edit that quietly drops web/apps/showcase would otherwise leave the app to rot
        # green. Costs nothing and builds nothing — it only looks at what the step above wrote.
        run: test -f web/apps/showcase/dist/index.html
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Install Chromium for Storybook tests in Vitest browser mode # P3-4
        if: needs.plan.outputs.gallery == 'true'
        run: pnpm --filter @iiiivaska/prism-gallery exec playwright install --with-deps chromium
      - name: Unit, component and a11y tests
        # From P3-4 the gallery runs its stories as Vitest browser-mode and a11y tests here.
        # Visual regression runs only in web-vrt, inside the pinned Playwright image.
        run: pnpm -r --filter '!@iiiivaska/prism-vrt' test
      - name: Upload static Storybook for visual regression # P3-4
        if: needs.plan.outputs.gallery == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: web/apps/gallery/storybook-static
          if-no-files-found: error

  web-vrt:
    name: Web visual regression
    runs-on: ubuntu-latest
    needs: [plan, web]
    # P3-4: runs once the Playwright suite and the Storybook it screenshots have landed.
    if: needs.plan.outputs.vrt == 'true' && needs.plan.outputs.gallery == 'true'
    container:
      # Keep the tag equal to the @playwright/test version in pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # A container job runs as root with HOME=/github/home, which root does not own, and Firefox
      # refuses to launch there ("Running Nightly as root in a regular user's session is not
      # supported"). Playwright's own message names this workaround; Chromium and WebKit do not care.
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: web/apps/gallery/storybook-static
      - uses: pnpm/setup@v2.1.0 # pnpm from packageManager, Node 24 (.node-version), pnpm install --frozen-lockfile
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Build the packages the runtime-contract fixture packs # P3-4, P5-3 SD-7
        # This job takes storybook-static from the `web` job instead of building it, so no `dist/` exists
        # here. web/apps/vrt/fixture/build.ts runs `npm pack` over @iiiivaska/prism-tokens and
        # @iiiivaska/prism-react, whose export maps point at dist/, and serve.ts builds the fixture when it
        # starts, its direction page with Vite at the browser floor. pnpm builds the two in dependency order.
        run: pnpm --filter @iiiivaska/prism-tokens --filter @iiiivaska/prism-react build
      - name: Compare, or record baselines when there are none or the run asks for them # P3-4
        id: vrt-mode
        shell: bash
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.update-vrt-baselines }}
        run: |
          set -euo pipefail
          # `requested` tells the two recordings apart: the whole-folder re-record a person asked for, which writes
          # over committed baselines by design, and the one this step falls back to because the folder holds none,
          # which the hand-back below checks against BASE like any other.
          if [ "$REQUESTED" = true ]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi
          # Baselines are Linux renders of this image (web/apps/vrt/playwright.config.ts); .gitkeep is not one.
          if [ "$REQUESTED" = true ]; then
            echo "record=true" >> "$GITHUB_OUTPUT"
            echo "Recording baselines: requested by workflow_dispatch."
          elif [ -z "$(find web/apps/vrt/baselines/linux -type f -name '*.png' -print -quit 2>/dev/null)" ]; then
            echo "record=true" >> "$GITHUB_OUTPUT"
            echo "Recording baselines: web/apps/vrt/baselines/linux holds none."
          else
            echo "record=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Screenshot every story tagged vrt, and run the runtime contract in three engines
        # Two suites, split by Playwright project: the screenshots across scheme × density × viewport in
        # Chromium, and the runtime-contract spec (ADR-0019 rule 5, ADR-0025) in Chromium, WebKit and
        # Firefox, all three of which this image ships.
        if: steps.vrt-mode.outputs.record == 'false'
        run: pnpm --filter @iiiivaska/prism-vrt test
      - name: Record the Linux baselines
        id: vrt-record
        if: steps.vrt-mode.outputs.record == 'true'
        run: pnpm --filter @iiiivaska/prism-vrt run test:update
      - name: A missing baseline is a recording, a changed one is a regression # P3-4
        # The hand-back, in both modes, bar the one recording a person asked for. It is the script the apple job runs
        # over its SwiftUI baselines, because the two halves of a component land together and hand back the same
        # way; .github/scripts/baseline-handback.sh has the rules and the two known limits, and the apple job's step
        # of the same name sums them up. Playwright makes the distinction the SwiftUI suite makes. In compare mode,
        # with `updateSnapshots` at its default `missing`, a screenshot with no baseline is written to the baseline
        # path and the test fails (`handleMissing`), and a screenshot that *differs* is written to test-results only,
        # never over the baseline (`handleDifferent`). The branches that rewrite a baseline need --update-snapshots=all
        # or =changed, which only the record step above passes, and it runs in two cases:
        #
        #   - `vrt-mode` found no PNG under `baselines/linux`. Then nothing is committed there for =all to write
        #     over, so this mode too can only add files that are in no commit, and the script looks each one up in
        #     BASE like any other. That is what stops a change that deletes *every* Linux baseline: it flips this job
        #     into record mode, the whole set is rendered afresh, and the script refuses it as re-recorded deletions,
        #     exactly as it would refuse one. Only a folder that BASE has no baselines in either hands back whole.
        #   - `workflow_dispatch` with `update-vrt-baselines` (`requested`), the sanctioned whole-folder re-record and
        #     the web twin of the apple job's `update-snapshot-baselines-apple`. It writes over committed baselines on
        #     purpose, so this step, which would refuse every one of them, is skipped, and the folder goes out whole
        #     through the recording upload below.
        #
        # Like the apple job's hand-back, this step is reached only through a green `contracts`: this job needs `web`,
        # which needs `contracts`, and the apple job's step of the same name says what that asks of a landing commit.
        id: vrt-handback
        if: always() && steps.vrt-mode.outputs.requested == 'false'
        shell: bash
        env:
          BASELINES: web/apps/vrt/baselines/linux
          STAGING: ${{ runner.temp }}/vrt-baselines
          ARTIFACT: vrt-baselines
          DIFFS: vrt-diffs
          RERECORD: update-vrt-baselines
          # Empty on workflow_dispatch; the script then measures against the default branch's tip.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/baseline-handback.sh
      - name: Upload the Linux baselines this run recorded
        # The same artifact name as the recording upload below, and never in the same run: that one hands back the
        # requested re-record's whole folder, this one exactly the files the script staged, and `requested` picks
        # exactly one of them.
        if: always() && steps.vrt-handback.outputs.recorded == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vrt-baselines
          path: ${{ runner.temp }}/vrt-baselines
          if-no-files-found: error
      - name: Upload the recorded baselines
        # `always()`: a recording run that stopped part-way — a runtime-contract regression in this
        # container, a screenshot timeout, a crashed worker — still hands back the images it did write.
        # A bare `record == 'true'` is ANDed with success(), so that run would go red with no artifact and
        # no diagnostics, and the operator would have nothing to act on. `warn` rather than `error` for
        # the same reason: the step that failed has already said why, and a second red X over an empty
        # folder would only bury it. Only the requested re-record uploads the folder unchecked; a recording
        # `vrt-mode` fell back to leaves through the hand-back above, after the script has checked it.
        if: always() && steps.vrt-mode.outputs.requested == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vrt-baselines
          path: web/apps/vrt/baselines/linux
          if-no-files-found: warn
      - name: Ask for the recorded baselines to be committed
        # Only after a complete requested re-record: a failed one has already failed the job with its own message,
        # and a recording `vrt-mode` fell back to is the hand-back's to report, which says what it staged or why it
        # refused.
        if: steps.vrt-record.outcome == 'success' && steps.vrt-mode.outputs.requested == 'true'
        shell: bash
        run: |
          echo "::error title=VRT baselines recorded, not compared::This run recorded new Linux baselines instead of comparing against committed ones. Download the 'vrt-baselines' artifact of this run, unpack it into web/apps/vrt/baselines/linux/ (so the files sit at web/apps/vrt/baselines/linux/<Component>/<example-id>.<platform>.<scheme>.<density>.png, the platform being web-desktop or web-touch), review the images, commit them, and push; the next run compares against them."
          exit 1
      - uses: actions/upload-artifact@v7
        # Either mode: a compare run's diffs and traces, or what a recording run left behind when it
        # stopped. After a complete recording the job fails by design — the step above for a requested
        # re-record, the hand-back for any other — and this folder is empty, which `ignore` passes over in
        # silence.
        if: failure()
        with:
          name: vrt-diffs
          path: web/apps/vrt/test-results
          if-no-files-found: ignore

  apple:
    name: Swift package
    runs-on: macos-26
    needs: [plan, contracts]
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "::error::Xcode $XCODE_VERSION is not installed on this runner image. Installed:"
            ls -d /Applications/Xcode_*.app
            exit 1
          fi
          app="$(cd "$app" && pwd -P)" # resolve alias symlinks such as Xcode_26.6.0.app
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
      - run: xcodebuild -version && swift --version
      - name: Validate SF Symbol names at minimum OS # P2-2
        if: needs.plan.outputs.icons_apple == 'true'
        run: swift run --package-path tools/icons-apple icons-validate spec/icons/registry.json
      - name: Build and test (macOS host)
        run: |
          swift build
          swift test
      - name: Build for iOS Simulator and watchOS Simulator
        run: |
          xcodebuild build -scheme Prism-Package -destination 'generic/platform=iOS Simulator'
          xcodebuild build -scheme Prism-Package -destination 'generic/platform=watchOS Simulator'
      - name: The showcase target compiles # P3-7
        # docs/showcase.md §5: everything the Apple showcase app is made of except its twenty-line shell is
        # the package target DSShowcase, so the three builds above already compile it — for macOS, for the
        # iOS Simulator and for the watch, where its screens are `#if os(iOS) || os(macOS)` and the module
        # comes out empty. This names that contract and costs nothing: .build is warm, so it is a no-op when
        # the target is healthy, and it is the step that says so when a component that landed in
        # DSComponentsManifest has no DS<Name>Renderer yet. Compile only, by design — no simulator run and no
        # snapshots. The app *bundle* is never built here: it would want a generated Xcode project and a
        # second DerivedData tree for a shell of about twenty lines.
        run: swift build --target DSShowcase
      - name: Compile the color catalog for iOS, macOS and watchOS and check its entries # P1-5
        if: needs.plan.outputs.tokens_build == 'true' && needs.plan.outputs.xcassets == 'true'
        run: bash tools/tokens/scripts/verify-xcassets.sh
      - name: DSTokens catalog tests on the iOS Simulator # P1-5
        if: needs.plan.outputs.tokens_build == 'true' && needs.plan.outputs.catalog_tests == 'true'
        run: xcodebuild test -scheme Prism-Package -only-testing:DSTokensTests -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
      - name: DSTokens catalog tests on the watchOS Simulator # P1-5
        # ARCHITECTURE V1, checked 2026-09-15 with Xcode 26.6: Prism-Package cannot test on watchOS, because
        # its test action also builds DSSnapshotTests and SnapshotTesting 1.19.4 does not compile for watchOS
        # ("cannot find 'Image' in scope"). This step therefore runs the shared scheme DSTokensTests
        # (.swiftpm/xcode/xcshareddata/xcschemes/DSTokensTests.xcscheme), which builds DSTokens and tests only DSTokensTests.
        if: needs.plan.outputs.tokens_build == 'true' && needs.plan.outputs.catalog_tests == 'true' && needs.plan.outputs.dstokens_scheme == 'true'
        run: xcodebuild test -scheme DSTokensTests -destination 'platform=watchOS Simulator,name=Apple Watch Series 11 (46mm),OS=latest'
      - name: DSCore tests on the iOS Simulator # P3-1
        # ADR-0021 rule 7 asks for the font registration and the rendering checks on the iOS and watchOS
        # simulators as well as the host, and ADR-0019 rule 12 for the mapping over the iOS `platformDefault`
        # (regular, touch).
        if: needs.plan.outputs.dscore_tests == 'true'
        run: xcodebuild test -scheme Prism-Package -only-testing:DSCoreTests -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
      - name: DSCore tests on the watchOS Simulator # P3-1
        # ADR-0021 rule 7: the same suite on watchOS, which is also the only place `DSPlatform.isWatch` and
        # `fixesColorSchemeToDark` are true in a real build, so the watch rows of the surface table and the
        # watch hero role are exercised for real and not only through the injected parameters. It runs the
        # shared scheme DSCoreTests (.swiftpm/xcode/xcshareddata/xcschemes/DSCoreTests.xcscheme) for the reason
        # the DSTokens watchOS step above gives: Prism-Package's test action also builds DSSnapshotTests, whose
        # SnapshotTesting does not compile for watchOS (ARCHITECTURE V1).
        if: needs.plan.outputs.dscore_tests == 'true' && needs.plan.outputs.dscore_scheme == 'true'
        run: xcodebuild test -scheme DSCoreTests -destination 'platform=watchOS Simulator,name=Apple Watch Series 11 (46mm),OS=latest'
      - name: Compare, or record baselines when there are none or the run asks for them # P3-3
        # The `vrt-mode` step of `web-vrt`, for the SwiftUI baselines. `requested` tells the two recordings apart: the
        # whole-folder re-record a person asked for (`update-snapshot-baselines-apple`), which writes over committed
        # baselines by design, and the one this job falls back to because `__Snapshots__` holds none (the plan's
        # `snapshots` gate is false), which the hand-back below checks against BASE like any other. The input is read
        # only on `workflow_dispatch`: on push and pull_request the expression is false before it looks at an input,
        # and a dispatch that leaves the box unticked passes the input's default, false.
        id: snapshot-mode
        shell: bash
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.update-snapshot-baselines-apple }}
          COMMITTED: ${{ needs.plan.outputs.snapshots }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = true ]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
            echo "record=true" >> "$GITHUB_OUTPUT"
            echo "Recording baselines: requested by workflow_dispatch."
          elif [ "$COMMITTED" != true ]; then
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "record=true" >> "$GITHUB_OUTPUT"
            echo "Recording baselines: swift/Tests/DSSnapshotTests/__Snapshots__ holds none."
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "record=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Gallery snapshots (SwiftUI) # P3-3
        # Every spec example (swift/Tests/DSSnapshotTests) against the baselines under its __Snapshots__, which compare
        # only with the Xcode they were recorded with (XCODE_VERSION). Three modes, which `snapshot-mode` above picks:
        #
        #   - compare, once a set is committed: an example whose baseline is **missing** — a new component's, a new
        #     example's, a new variant's — is recorded and fails on its own (`DSExampleSnapshotTests.verify`: in compare
        #     mode the one write is the `!exists` branch), and one whose baseline differs fails without writing;
        #   - record the whole set and fail, while `__Snapshots__` holds none;
        #   - record the whole set over the committed one, when a person dispatched `update-snapshot-baselines-apple`.
        #     This step then passes, and the job fails further down, once the folder is uploaded.
        #
        # In the first two the step after this one hands back what was written, so a baseline is reviewed and committed
        # before it becomes the reference; the third hands back the whole folder unchecked. xcodebuild hands
        # TEST_RUNNER_* variables to the tests without the prefix. The P3-5 gallery is built from these baselines
        # themselves, in the `contracts` job, so nothing here writes a second copy of an image.
        # The destination is pinned to the runtime the baselines are recorded on, not `latest`: a newer simulator
        # runtime rasterizes differently, and the suite would then fail for the runtime and not for the code
        # (swift/Tests/DSSnapshotTests/README.md, "Provenance"). Move this pin and the baselines together.
        id: swiftui-snapshots
        env:
          RECORD: ${{ steps.snapshot-mode.outputs.record }}
          REQUESTED: ${{ steps.snapshot-mode.outputs.requested }}
          # Where a failing comparison leaves its reference, failure and difference images. Without this they go to
          # the simulator's temporary directory, and the failure message then names a path that dies with the runner.
          TEST_RUNNER_DS_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-diffs-apple
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RECORD" = true ]; then export TEST_RUNNER_DS_SNAPSHOT_RECORD=1; fi
          xcodebuild test -scheme Prism-Package -only-testing:DSSnapshotTests -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          if [ "$RECORD" = true ] && [ "$REQUESTED" != true ]; then
            echo "::error title=SwiftUI baselines recorded, not compared::This run recorded the SwiftUI snapshot baselines with Xcode $XCODE_VERSION instead of comparing, because swift/Tests/DSSnapshotTests/__Snapshots__ holds none. Download the 'snapshot-baselines-apple' artifact of this run, unpack it into swift/Tests/DSSnapshotTests/__Snapshots__/ (so the files sit at __Snapshots__/<Component>/<example-id>.ios.<scheme>.<density>[.<variant>].png, beside the provenance.json that says what recorded them), review the images, commit them, and push; the next run compares against them."
            exit 1
          fi
      - name: A missing baseline is a recording, a changed one is a regression # P3-3
        # The hand-back, in both of the modes a person did not ask for. The suite writes into the runner's checkout,
        # and the runner is then discarded, so whatever a run records has to leave as an artifact or it is lost. CI is
        # also the only machine that can record a set the next run can compare against (XCODE_VERSION is 26.6; the
        # owner's Mac is on 27, docs/roadmap.md "Xcode 27 lane"). The suite's exit code does not decide what may
        # leave. Git and the commit the change is measured against decide it, and .github/scripts/baseline-handback.sh
        # has the table; the web job runs the same script. In short:
        #
        #   - A file in no commit is a recording. It is handed back, and the run stays red so that someone looks at
        #     it first.
        #   - A committed baseline written over (` M`) is refused. No run this step checks has a code path that does
        #     this: the only wholesale rewrite is DS_SNAPSHOT_RECORD, which `snapshot-mode` sets while no baseline is
        #     committed, when there is nothing to write over, and for the requested re-record, which skips this step.
        #   - A baseline this change deleted and the run recorded again is refused too.
        #
        # The last rule is the one that stops a component whose render changed from passing itself off as new. Its
        # baseline is still in the commit, so the suite compares, fails on the pixels and writes nothing into
        # __Snapshots__. Deleting that baseline would make the suite record it, and nothing in the suite notices:
        # `everyCommittedBaselineBelongsToTheMatrix` only finds PNGs the matrix no longer renders, never a missing
        # one. So the script looks every new path up in BASE and refuses the ones it finds there. A render that
        # changed on purpose is accepted through the one route that may write over a committed baseline: dispatch
        # `ci` with `update-snapshot-baselines-apple`, and commit its `snapshot-baselines-apple` artifact over
        # __Snapshots__/, so that review sees changed baselines and not deletions. The comparing run before it is
        # where to look first: the `snapshot-diffs-apple` upload below holds the reference, failure and difference
        # image of every comparison that failed.
        #
        # Two known limits, both in the script's header with the commands that expose them. Each still lets a
        # changed render reach the artifact labelled as a recording; each needs a deletion that review sees, and
        # neither turns the run green, because a run that stages anything fails. So the reviewer of a hand-back is
        # the check on both:
        #
        #   - A deletion older than BASE. The script sees only what changed between BASE and this checkout. On a push
        #     BASE is `github.event.before`, one push back, so a baseline deleted by an earlier push (whose own run
        #     refused the re-recording and went red) is not in the commit the next run looks it up in, and that
        #     run stages the path again as new. A push lands on the default branch, so every later run measured against
        #     it — the next push, a pull request, workflow_dispatch — does the same.
        #   - A rename. A change that renames an example, a component or a forced-state variant deletes the old
        #     baseline and records the new path. The new path is in no commit, so it is staged as new, and the
        #     script does not pair it with the deletion beside it.
        #
        # This step, like the whole job, runs only when `contracts` is green (`needs: [plan, contracts]`; `web-vrt`
        # sits behind it too, through `web`): a fresh gallery index, a fresh parity report and, on main, no parity
        # lag. A commit that leaves gallery/index.json or tools/parity/report.md stale skips this job, and then no
        # baseline is recorded at all, so the commit that lands a component and the commit that adds its baselines
        # must each carry a regenerated parity report and gallery index (`pnpm parity:report`, `pnpm gallery:build`).
        id: apple-baselines
        if: always() && steps.swiftui-snapshots.outcome != 'skipped' && steps.snapshot-mode.outputs.requested == 'false'
        shell: bash
        env:
          BASELINES: swift/Tests/DSSnapshotTests/__Snapshots__
          STAGING: ${{ runner.temp }}/snapshot-baselines-apple
          ARTIFACT: snapshot-baselines-apple
          DIFFS: snapshot-diffs-apple
          RERECORD: update-snapshot-baselines-apple
          # Empty on workflow_dispatch; the script then measures against the default branch's tip.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/baseline-handback.sh
      - name: Upload the baselines this run recorded # P3-3
        # `always()`: the run is red by then — the suite fails on every baseline it had to record — and a hand-back
        # that only ran on success would never run at all. Exactly the staged files, at the paths they belong at, so
        # the artifact unzips over __Snapshots__/ without a second thought. The same artifact name as the recording
        # upload below, and never in the same run: that one hands back the requested re-record's whole folder, this
        # one exactly the files the script staged, and `requested` picks exactly one of them.
        if: always() && steps.apple-baselines.outputs.recorded == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-baselines-apple
          path: ${{ runner.temp }}/snapshot-baselines-apple
          if-no-files-found: error
      - name: Upload the recorded baselines # P3-3
        # The requested re-record's hand-back, the twin of the `web-vrt` step of the same name: the whole __Snapshots__
        # folder, provenance.json included, with every baseline the suite rewrote over the committed one. The renders
        # are a pure function of the view and the pins (swift/Tests/DSSnapshotTests/README.md, "Tolerance"), so after
        # unpacking git reports the images that moved. `always()`, so a recording that stopped part-way — a pixel
        # suite of this target failing, a crashed simulator — still hands back what it wrote; `warn` rather than
        # `error`, because the step that failed has already said why. Only the requested re-record reaches this step,
        # so only a person's dispatch uploads a committed baseline written over, and nothing checks it but the review
        # of what it holds.
        if: always() && steps.snapshot-mode.outputs.requested == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-baselines-apple
          path: swift/Tests/DSSnapshotTests/__Snapshots__
          if-no-files-found: warn
      - name: Ask for the recorded baselines to be committed # P3-3
        # Only after a complete requested re-record, as in `web-vrt`: a failed one has already failed the job with its
        # own message, and the recording `snapshot-mode` falls back to says what to do in the snapshot step itself.
        if: steps.swiftui-snapshots.outcome == 'success' && steps.snapshot-mode.outputs.requested == 'true'
        shell: bash
        run: |
          echo "::error title=SwiftUI baselines recorded, not compared::This run was dispatched with update-snapshot-baselines-apple, so it recorded every SwiftUI snapshot baseline with Xcode $XCODE_VERSION instead of comparing. Download the 'snapshot-baselines-apple' artifact of this run and unpack it over swift/Tests/DSSnapshotTests/__Snapshots__/ (so the files sit at __Snapshots__/<Component>/<example-id>.ios.<scheme>.<density>[.<variant>].png, beside provenance.json). git status then lists the baselines whose bytes changed: review each one against the committed image (git diff, or the previous comparing run's 'snapshot-diffs-apple' artifact), check any path in no commit with the two git log commands in .github/scripts/baseline-handback.sh, commit what the change meant to move, and push; the next run compares against them."
          exit 1
      - name: Upload what a failing comparison rendered # P3-3
        # The apple job's `vrt-diffs`: the reference, the failure and the difference image the suite writes for every
        # comparison that failed (TEST_RUNNER_DS_SNAPSHOT_ARTIFACTS above). Empty on a run that recorded instead of
        # comparing, which `ignore` passes over in silence; a requested re-record fails by design one step up and
        # reaches here with nothing in it.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-diffs-apple
          path: ${{ runner.temp }}/snapshot-diffs-apple
          if-no-files-found: ignore
