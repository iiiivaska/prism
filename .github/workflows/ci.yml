name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Tokens, specs, registries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate token files against the DTCG 2025.10 schemas
        run: |
          npx -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft7 -c ajv-formats \
            -s https://www.designtokens.org/schemas/2025.10/format.json -d "tokens/**/*.tokens.json" -d "brands/*/brand.tokens.json"
          npx -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft7 -c ajv-formats \
            -s https://www.designtokens.org/schemas/2025.10/resolver.json -d tokens/prism.resolver.json
      - name: Validate specs against JSON Schema
        run: pnpm --filter @iiiivaska/prism-tools spec:validate
      - name: Validate icon registry against Phosphor catalog
        run: pnpm --filter @iiiivaska/prism-tools icons:validate
      - name: Build tokens and fail on stale generated output
        run: |
          pnpm --filter @iiiivaska/prism-tools tokens:build
          git diff --exit-code -- swift/Sources/DSTokens/Generated web/packages/tokens/dist-src
      - name: Lint resolver orthogonality with Terrazzo
        run: pnpm --filter @iiiivaska/prism-tools tokens:lint
      - name: Contrast test for every brand and scheme
        run: pnpm --filter @iiiivaska/prism-tools contrast:check
      - name: License inventory gate
        run: pnpm --filter @iiiivaska/prism-tools licenses:check
      - name: Parity report
        run: pnpm --filter @iiiivaska/prism-tools parity:report --fail-on-lag
      - uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: tools/parity/report.md

  web:
    name: Web packages
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './web/packages/**' build
      - name: Component and a11y tests (Storybook stories in Vitest browser mode)
        run: pnpm --filter @iiiivaska/prism-gallery test
      - name: Build static Storybook
        run: pnpm --filter @iiiivaska/prism-gallery build
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: web/apps/gallery/storybook-static

  web-vrt:
    name: Web visual regression
    runs-on: ubuntu-latest
    needs: web
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: web/apps/gallery/storybook-static
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Screenshot every story tagged vrt across scheme × density × viewport
        run: pnpm --filter @iiiivaska/prism-vrt test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vrt-diffs
          path: web/apps/vrt/test-results

  apple:
    name: Swift package
    runs-on: macos-26
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app
      - name: Validate SF Symbol names at minimum OS
        run: swift run --package-path tools/icons-apple icons-validate ../../spec/icons/registry.json
      - name: Build and test (macOS host)
        run: swift build && swift test
      - name: Build for iOS simulator, watchOS simulator
        run: |
          xcodebuild -scheme Prism -destination 'generic/platform=iOS Simulator' build
          xcodebuild -scheme Prism -destination 'generic/platform=watchOS Simulator' build
      - name: Gallery snapshots (SwiftUI)
        run: xcodebuild -scheme DSSnapshots -destination 'platform=iOS Simulator,name=iPhone 17' test
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots-apple
          path: gallery/snapshots/**/*.apple.*.png
