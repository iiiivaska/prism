name: Sample
layer: primitive
specVersion: 1
status: draft
summary: >-
  A fixture component. It exists only so that tools/spec/fixtures can break one rule at a time; it is
  never implemented and never appears in the parity report.
since: 0.1.0

platforms:
  ios: full
  ipados: full
  macos: full
  watchos: none
  web-touch: full
  web-desktop: full
density: [compact, regular, comfortable]
modality: [pointer, touch]
schemes: [light, dark]

anatomy:
  - part: root
  - part: label

props:
  - name: size
    type: enum
    values: [sm, md]
    default: md

states: [default, pressed]

tokens:
  root:
    background:
      default: color.bg.fill.inverse
      vivid: color.bg.fill.inverse-media
      glass: color.bg.fill.inverse-media
      glassLight: color.bg.fill.inverse
    radius: radius.control
    pressed:
      background:
        default: color.bg.fill.inverse-pressed
        vivid: color.bg.fill.inverse-media-pressed
        glass: color.bg.fill.inverse-media-pressed
  label:
    typography:
      sm: type.label.sm
      md: type.label.md
    color:
      default: color.text.on-inverse
      vivid: color.text.on-inverse-media
      glass:
        default: color.text.on-inverse
        map: color.text.on-inverse-media
      glassLight: color.text.on-inverse-media

behavior:
  - The fixture draws one solid pill with one label and nothing else.
  - The hit region is the larger of the visual size and size.hit on each axis.

accessibility:
  role: group
  label: none; the fixture is a container
  keyboard: not focusable
  dynamicType: the label scales with type.label.*
  contrast: the label pair is checked by tools/contrast
  reduceTransparency: nothing in the fixture is translucent
  reduceMotion: nothing moves, so nothing is substituted

usage:
  do:
    - Use the fixture only in the tools/spec tests.
  dont:
    - Don't ship the fixture in a release.

examples:
  - id: default-md
    props: { size: md }
