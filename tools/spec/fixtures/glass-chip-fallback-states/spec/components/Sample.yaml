name: Sample
layer: primitive
specVersion: 1
status: draft
summary: >-
  A fixture component. It exists only so that tools/spec/fixtures can break one rule at a time; it is
  never implemented and never appears in the parity report.
since: 0.1.0

platforms:
  ios: full
  ipados: full
  macos: full
  watchos: none
  web-touch: full
  web-desktop: full
density: [compact, regular, comfortable]
modality: [pointer, touch]
schemes: [light, dark]

anatomy:
  - part: field
  - part: pill
  - part: track
  - part: strip
  - part: label

props:
  - name: placement
    type: enum
    values: [floating, inline]
    default: floating
  - name: size
    type: enum
    values: [sm, md]
    default: md

states: [default, pressed, selected, readonly]

tokens:
  field:
    background: color.bg.surface.raised
    fallbackBackground: color.bg.surface.raised
    radius: radius.control
    readonly:
      background:
        default: color.bg.surface.raised
        page:
          default: color.bg.surface.raised
          map: material.glass.chip
  pill:
    background:
      default: color.bg.surface.raised
      page:
        default: color.bg.surface.raised
        map: material.glass.chip
    fallbackBackground: color.bg.surface.raised
    fallbackUnderlay: color.bg.page
    radius: radius.control
    pressed:
      fallbackBackground: color.bg.fill.neutral.subtle
    selected:
      fallbackBackground: color.bg.surface.raised
      fallbackUnderlay: color.bg.page
    readonly:
      fallbackUnderlay:
        page: color.bg.page
  track:
    background:
      floating:
        default: color.bg.surface.raised
        page:
          default: color.bg.surface.raised
          map: material.glass.chip
    fallbackBackground:
      floating: color.bg.surface.raised
    fallbackUnderlay:
      floating: color.bg.page
    radius:
      floating: radius.control
    pressed:
      fallbackUnderlay:
        floating: color.bg.surface
    selected:
      fallbackBackground: color.bg.surface.raised
  strip:
    background:
      floating:
        page:
          map: material.glass.chip
    fallbackBackground:
      floating: color.bg.surface.raised
      inline: color.bg.surface.raised
    fallbackUnderlay:
      floating: color.bg.page
    readonly:
      background:
        inline:
          page:
            map: material.glass.chip
  label:
    typography:
      sm: type.label.sm
      md: type.label.md
    color:
      default: color.text.primary
      page:
        default: color.text.primary
        map: color.text.on-glass-fill

behavior:
  - The fixture draws one field, one pill, one track and one strip, each as the glass chip over a map in some state, and one label.
  - The hit region is the larger of the visual size and size.hit on each axis.

accessibility:
  role: group
  label: none; the fixture is a container
  keyboard: not focusable
  dynamicType: the label scales with type.label.*
  contrast: the label pair is checked by tools/contrast
  reduceTransparency: under Increase Contrast, Prism's Surface module draws each chip as color.bg.surface.raised over color.bg.page at the same radius; blur, saturation and the inner edge are dropped; the chip publishes raised, so every part takes its default cell
  reduceMotion: nothing moves, so nothing is substituted

usage:
  do:
    - Use the fixture only in the tools/spec tests.
  dont:
    - Don't ship the fixture in a release.

examples:
  - id: default-md
    props: { size: md }
  - id: over-map
    props: { size: md }
    surface: map
