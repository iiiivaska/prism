name: Sample
layer: primitive
specVersion: 1
status: draft
summary: >-
  A fixture component. It exists only so that tools/spec/fixtures can break one rule at a time; it is
  never implemented and never appears in the parity report.
since: 0.1.0

platforms:
  ios: full
  ipados: full
  macos: full
  watchos: none
  web-touch: full
  web-desktop: full
density: [compact, regular, comfortable, watch]
modality: [pointer, touch]
schemes: [light, dark]

anatomy:
  - part: root
  - part: label
  - part: content
    optional: true
    slot: true

props:
  - name: variant
    type: enum
    values: [solid, glass]
    default: solid
  - name: size
    type: enum
    values: [sm, md]
    default: md
  - name: label
    type: string
  - name: count
    type: number
  - name: isOn
    type: boolean
    default: false
  - name: icon
    type: icon
  - name: content
    type: slot
  - name: onPress
    type: action

states: [default, pressed]

tokens:
  root:
    background:
      solid: color.bg.surface
      glass: material.glass.fill
    radius: radius.card
    padding: space.card-padding
    pressed:
      overlay: color.bg.fill.neutral.subtle
  label:
    typography:
      sm: type.label.sm
      md: type.label.md
    color:
      solid: color.text.primary
      glass: color.text.on-glass-fill

behavior:
  - The fixture draws one surface with one label and nothing else.
  - The hit region is the larger of the visual size and size.hit on each axis.

motion:
  press: motion.spring.snappy
  reduceMotion: crossfade

haptics:
  press: haptic.press.button

accessibility:
  role: group
  label: none; the fixture is a container
  keyboard: not focusable
  dynamicType: the label scales with type.label.*
  contrast: the label pair is checked by tools/contrast
  reduceTransparency: glass resolves to an opaque raised surface over color.bg.page
  reduceMotion: the press scale is replaced by a fill change to color.bg.fill.neutral.subtle

usage:
  do:
    - Use the fixture only in the tools/spec tests.
  dont:
    - Don't ship the fixture in a release.

examples:
  - id: solid
    props: { variant: solid, size: md, label: "Sample", count: 3, isOn: false, icon: nav.back }
  - id: glass-over-map
    props: { variant: glass }
    surface: map
  - id: open-types
    props: { content: { fixture: text, lines: 2 }, onPress: true }
    description: a slot takes the forms of spec/SCHEMA.md and an action the galleries' own handler, so neither value is read
  - id: undeclared
    props: { variant: solid, tone: accent }
  - id: enum-value
    props: { variant: frosted, size: [sm, lg] }
  - id: boolean-value
    props: { isOn: "yes" }
  - id: number-value
    props: { count: "12" }
  - id: string-value
    props: { label: 24 }
  - id: icon-value
    props: { icon: avatar.sm }
  - id: icon-mapping
    props: { icon: { avatar: { size: sm } } }
  - id: image-fixture
    props: { label: { fixture: portrait } }
    description: a string that is an image's source takes spec/SCHEMA.md's image fixture, so this passes
  - id: image-fixture-unknown
    props: { label: { fixture: headshot } }
  - id: image-fixture-parameters
    props: { label: { fixture: portrait, size: sm } }
