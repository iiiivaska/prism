name: Sample
layer: primitive
specVersion: 1
status: draft
summary: >-
  A fixture component. It exists only so that tools/spec/fixtures can break one rule at a time; it is
  never implemented and never appears in the parity report.
since: 0.1.0

platforms:
  ios: full
  ipados: full
  macos: full
  watchos: none
  web-touch: full
  web-desktop: full
density: [compact, regular, comfortable]
modality: [pointer, touch]
schemes: [light, dark]

anatomy:
  - part: root
  - part: label
  - part: icon

props:
  - name: size
    type: enum
    values: [sm, md]
    default: md

states: [default, focus-visible]

tokens:
  root:
    background: color.bg.surface.raised
    border:
      default: color.border.hairline
      vivid: color.border.focus-on-media
    radius: radius.control
    focus-visible:
      ring:
        sm: color.border.focus
        md: color.border.focus
      ringWidth: border.focus
  label:
    typography:
      sm: type.label.sm
      md: type.label.md
    color: color.text.primary
    focus-visible:
      ring: color.text.primary
      ringWidth: border.strong
  icon:
    size: size.icon.md
    focus-visible:
      ring: color.border.focus
      ringWidth: border.focus

behavior:
  - The fixture draws one raised pill with one label and one glyph, and nothing else.
  - The hit region is the larger of the visual size and size.hit on each axis.

accessibility:
  role: group
  label: none; the fixture is a container
  keyboard: not focusable
  dynamicType: the label scales with type.label.*
  contrast: the label pair is checked by tools/contrast
  reduceTransparency: nothing in the fixture is translucent
  reduceMotion: nothing moves, so nothing is substituted

usage:
  do:
    - Use the fixture only in the tools/spec tests.
  dont:
    - Don't ship the fixture in a release.

examples:
  - id: default-md
    props: { size: md }
