name: Sample
layer: primitive
specVersion: 1
status: draft
summary: >-
  A fixture component. It exists only so that tools/spec/fixtures can break one rule at a time; it is
  never implemented and never appears in the parity report.
since: 0.1.0

platforms:
  ios: full
  ipados: full
  macos: full
  watchos: none
  web-touch: full
  web-desktop: full
density: [compact, regular, comfortable]
modality: [pointer, touch]
schemes: [light, dark]

anatomy:
  - part: root
  - part: track
  - part: scrollEdge
  - part: label

props:
  - name: placement
    type: enum
    values: [floating, inline]
    default: floating
  - name: scrollEdge
    type: enum
    values: [soft, hard, none]
    default: soft
  - name: size
    type: enum
    values: [sm, md]
    default: md

states: [default]

tokens:
  root:
    background:
      default: color.bg.surface.raised
      page:
        default: color.bg.surface.raised
        map: material.glass.chip
    fallbackUnderlay: color.bg.page
    radius: radius.control
  track:
    background:
      floating:
        default: color.bg.surface.raised
        page:
          default: color.bg.surface.raised
          map: material.glass.chip
    fallbackBackground: color.bg.surface.raised
    fallbackUnderlay:
      floating:
        page: color.bg.page
    radius:
      floating: radius.control
  scrollEdge:
    background:
      soft: material.glass.chip
      hard: material.glass.chip
    fallbackBackground:
      soft: color.bg.page
      hard: color.bg.page
  label:
    typography:
      sm: type.label.sm
      md: type.label.md
    color:
      default: color.text.primary
      page:
        default: color.text.primary
        map: color.text.on-glass-fill

behavior:
  - The fixture draws one pill, one track and one scroll edge, each over a map as the glass chip, and one label.
  - The hit region is the larger of the visual size and size.hit on each axis.

accessibility:
  role: group
  label: none; the fixture is a container
  keyboard: not focusable
  dynamicType: the label scales with type.label.*
  contrast: the label pair is checked by tools/contrast
  reduceTransparency: under Reduce Transparency the glass chip resolves to an opaque raised surface over color.bg.page
  reduceMotion: nothing moves, so nothing is substituted

usage:
  do:
    - Use the fixture only in the tools/spec tests.
  dont:
    - Don't ship the fixture in a release.

examples:
  - id: default-md
    props: { size: md }
  - id: over-map
    props: { size: md }
    surface: map
