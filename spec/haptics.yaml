# Semantic haptics registry (ADR-0003 puts haptics in DSCore; no ADR records this registry yet, critic G-19).
# Components reference `haptic.<name>`; DSCore maps it per platform. Web has no haptics
# (the Vibration API is unsuitable for UI feedback); the web binding is documented as none.
# Apple facts verified 2026-09-08 against SensoryFeedback and WKHapticType docs
# (docs/research/arch-apple.md §7): SensoryFeedback needs iOS 17 / macOS 14 / watchOS 10,
# which the OS 26 floor satisfies. Platform playback per Apple: success/warning/error/selection/impact
# play on iOS and watchOS; alignment on iOS and macOS; levelChange macOS only; start/stop watchOS only;
# increase/decrease watchOS and visionOS; pathComplete iOS only.
# Rules 5 to 8 were written for primitives wave 2 by roadmap P4-11 (2026-09-26), which also answers P4-D7 with
# rule 7; the version is the registry's own (ADR-0038) and moved to 0.2.0 with them.

version: 0.2.0
haptics:
  haptic.selection:
    intent: A discrete selection changed (segment, picker step, scrubber snap).
    ios: SensoryFeedback.selection
    macos: none
    watchos: SensoryFeedback.selection
    web: none
    reduceMotion: keep          # haptics are not motion; Apple does not suppress them under Reduce Motion

  haptic.impact.light:
    intent: A light touch landed (chip toggled, card lifted).
    ios: "SensoryFeedback.impact(weight: .light)"
    macos: none
    watchos: "SensoryFeedback.impact(weight: .light)"
    web: none

  haptic.impact.medium:
    intent: A control settled (sheet detent reached, toggle flipped).
    ios: "SensoryFeedback.impact(weight: .medium)"
    macos: none
    watchos: "SensoryFeedback.impact(weight: .medium)"
    web: none

  haptic.impact.soft:
    intent: A soft landing (drag released onto a target).
    ios: "SensoryFeedback.impact(flexibility: .soft)"
    macos: none
    watchos: "SensoryFeedback.impact(flexibility: .soft)"
    web: none

  haptic.success:
    intent: An action completed successfully (form saved, goal reached).
    ios: SensoryFeedback.success
    macos: none
    watchos: SensoryFeedback.success
    web: none

  haptic.warning:
    intent: Attention needed but not an error (limit approaching).
    ios: SensoryFeedback.warning
    macos: none
    watchos: SensoryFeedback.warning
    web: none

  haptic.error:
    intent: An action failed (validation error, request failed).
    ios: SensoryFeedback.error
    macos: none
    watchos: SensoryFeedback.error
    web: none

  haptic.alignment:
    intent: A dragged element snapped to a guide or grid.
    ios: SensoryFeedback.alignment
    macos: SensoryFeedback.alignment
    watchos: none
    web: none

  haptic.levelChange:
    intent: A stepped value crossed a level (macOS slider ticks).
    ios: none
    macos: SensoryFeedback.levelChange
    watchos: none
    web: none

  haptic.increase:
    intent: A value went up by one step (crown / stepper).
    ios: SensoryFeedback.selection     # closest available on iOS
    macos: none
    watchos: SensoryFeedback.increase
    web: none

  haptic.decrease:
    intent: A value went down by one step.
    ios: SensoryFeedback.selection
    macos: none
    watchos: SensoryFeedback.decrease
    web: none

  haptic.start:
    intent: A session or timer started.
    ios: "SensoryFeedback.impact(weight: .medium)"
    macos: none
    watchos: SensoryFeedback.start
    web: none

  haptic.stop:
    intent: A session or timer stopped.
    ios: "SensoryFeedback.impact(weight: .medium)"
    macos: none
    watchos: SensoryFeedback.stop
    web: none

  haptic.pathComplete:
    intent: A drawn path or gesture completed.
    ios: SensoryFeedback.pathComplete
    macos: none
    watchos: SensoryFeedback.success
    web: none

  # OS 26 control-specific feedback (SensoryFeedback.press / .release / .selection(.on|.off|.minimum|.maximum)).
  # Per-platform playback for these is not documented by Apple; treated as iOS + watchOS until verified on device.
  haptic.press.button:
    intent: Touch-down on a button (system-consistent press feel).
    ios: SensoryFeedback.press(.button)
    macos: none
    watchos: SensoryFeedback.press(.button)
    web: none
  # No Prism control binds haptic.press.toggle: a toggle's press plays the haptic of the value it changes (rule 5).
  haptic.press.toggle:
    intent: Touch-down on a toggle.
    ios: SensoryFeedback.press(.toggle)
    macos: none
    watchos: SensoryFeedback.press(.toggle)
    web: none
  haptic.press.slider:
    intent: Slider thumb grabbed.
    ios: SensoryFeedback.press(.slider)
    macos: none
    watchos: SensoryFeedback.press(.slider)
    web: none
  haptic.release.slider:
    intent: Slider thumb released.
    ios: SensoryFeedback.release(.slider)
    macos: none
    watchos: SensoryFeedback.release(.slider)
    web: none
  haptic.selection.on:
    intent: A binary control turned on.
    ios: SensoryFeedback.selection(.on)
    macos: none
    watchos: SensoryFeedback.selection(.on)
    web: none
  haptic.selection.off:
    intent: A binary control turned off.
    ios: SensoryFeedback.selection(.off)
    macos: none
    watchos: SensoryFeedback.selection(.off)
    web: none
  haptic.selection.limit:
    intent: A value hit its minimum or maximum.
    ios: SensoryFeedback.selection(.minimum|.maximum)
    macos: SensoryFeedback.alignment
    watchos: SensoryFeedback.selection(.minimum|.maximum)
    web: none

web:
  # The Vibration API (navigator.vibrate) works only on Chrome/Samsung for Android after sticky user activation
  # (max 10 entries, 10 s each); Safari and Firefox desktop do not support it. It is an optional, opt-in
  # progressive enhancement behind a consumer flag; it is never part of a component's contract.
  optionalPatternsMs:
    haptic.selection: [8]
    haptic.impact.light: [10]
    haptic.impact.medium: [20]
    haptic.success: [12, 60, 12]
    haptic.warning: [25, 60, 25]
    haptic.error: [30, 40, 30, 40, 30]

rules:
  - Components declare haptics by registry name only; DSCore owns the mapping and the WKInterfaceDevice fallback.
  - At most one haptic per user action; never on programmatic state changes.
  - watchOS enforces a 100 ms minimum between plays and no playback in the background; DSCore throttles.
  - No haptics while HealthKit heart-rate sampling is active on watchOS (Apple constraint).
  - "One action plays the haptic of what it did. A control whose own contract is to change a value - a Toggle's `isOn`, a Checkbox's `value`, the selection of a Radio or a SegmentedControl, the value of a Slider, a Stepper or a Pagination - plays the haptic of that change (haptic.selection.on or haptic.selection.off, haptic.selection, haptic.increase, haptic.decrease, haptic.selection.limit) in place of any press haptic for the same press, and a press that changes nothing plays nothing. A control whose press only asks the app for something - Button, Card, IconButton, and a filter Chip, whose `isSelected` the app sets - plays its press haptic on touch-down and nothing when the app then changes its state (rule 8). A drag's grab and release are events of their own, which haptic.press.slider and haptic.release.slider mark."
  - "One event, one haptic. Where two of a control's haptics fall on one event, the one that says more plays alone: haptic.selection.limit, not haptic.selection, on a Slider stop that is also an end. A jump that crosses several stops at once - a tap on a Slider's track, Page Up, Home - is one event and plays one haptic, for where it lands; a drag plays one at each stop it crosses."
  - "A host plays its haptic in place of its control's. A component that selects or steps through controls it hosts - TabBar and Pagination over their IconButtons, Stepper over its two - plays its own haptic instead of the hosted control's press haptic, never beside it. Each stack silences the hosted press haptic through a switch internal to its package, which the first such host builds; an app has no way to silence a Prism control's haptic, and the web, which plays none, has nothing to switch."
  - "A state the caller sets plays nothing. A component plays a haptic only for an action it receives - a press, a drag, a step from the keyboard, the Digital Crown or an assistive adjustment - and never because a prop changed: `isInvalid`, `isSelected`, `isOn` or `value` set by the caller is a programmatic change, whatever the user did upstream. The outcome of work only the app sees - a submission that fails validation, a request that succeeds - is the app's to play, once per outcome and never once per field, with DSCore's `dsHaptic(_:trigger:)`; no Prism component plays haptic.error, haptic.success or haptic.warning for it."
