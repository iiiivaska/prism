name: IconButton
layer: primitive
specVersion: 3
status: draft
summary: >-
  A circular action carrying one glyph and no label. It follows Button's pill grammar - a circle is the
  pill at its shortest - and the inverse-solid active rule: the single primary or selected circle in a
  group is the inverse solid, its siblings are hairline rings, raised pucks or bare glyphs. Every
  IconButton carries an explicit name, because the glyph is not one.
since: 0.1.0

platforms:
  ios: full
  ipados: full
  macos: full
  watchos: none
  web-touch: full
  web-desktop: full
density: [compact, regular, comfortable]
modality: [pointer, touch]
schemes: [light, dark]

anatomy:
  - part: root
    description: the circle; `plain` draws no chrome and the circle exists only as the hit region
  - part: icon
  - part: badge
    optional: true
    slot: true
    description: a Badge anchored outside the top-trailing corner; Badge owns its own look

props:
  - name: variant
    type: enum
    values: [primary, secondary, ghost, plain, danger]
    default: secondary
  - name: size
    type: enum
    values: [sm, md, lg]
    default: md
  - name: glyph
    type: icon
    required: true
    description: a registry id, rendered by Icon
  - name: label
    type: string
    required: true
    description: the accessible name on every platform and under every modality; never inferred from the glyph id, and shown on hover or on focus nowhere until Prism has a Tooltip of its own
  - name: badge
    type: slot
    description: an optional Badge anchored outside the top-trailing corner; Badge owns its own look
  - name: isSelected
    type: boolean
    default: false
  - name: isDisabled
    type: boolean
    default: false
  - name: onPress
    type: action
    required: true

states: [default, hover, pressed, selected, focus-visible, disabled]

tokens:
  root:
    background:
      primary:
        default: comp.icon-button.primary.bg.rest
        vivid: color.bg.fill.inverse-media
        inverse: color.text.on-inverse
        accent: color.text.on-accent
      secondary:
        page: comp.icon-button.secondary.bg.rest
        solid: comp.icon-button.secondary.bg.rest
        raised: comp.icon-button.secondary.bg.rest
        nested: comp.icon-button.secondary.bg.rest
        vivid: comp.icon-button.secondary.bg.rest
        glass: comp.icon-button.secondary.bg.rest
        glassLight: comp.icon-button.secondary.bg.rest
      danger: comp.icon-button.danger.bg.rest
    underlay:
      danger:
        vivid: color.bg.page
        glass: color.bg.page
        glassLight: color.bg.page
        inverse: color.bg.page
        accent: color.bg.page
    border:
      secondary:
        default: comp.icon-button.secondary.border
        inverse: color.text.on-inverse
        accent: color.text.on-accent-secondary
      ghost:
        default: comp.icon-button.ghost.border
        vivid: color.border.on-media
        glass: color.border.on-glass-fill
        glassLight: color.border.on-glass-fill
        inverse: color.text.on-inverse
        accent: color.text.on-accent-secondary
      danger: comp.icon-button.danger.border
    borderWidth:
      secondary: border.hairline
      ghost: border.hairline
      danger: border.hairline
    radius: radius.control
    size:
      sm: comp.icon-button.size.sm
      md: comp.icon-button.size.md
      lg: comp.icon-button.size.lg
    hover:
      overlay: color.bg.fill.neutral.subtle
    pressed:
      background:
        primary:
          default: comp.icon-button.primary.bg.pressed
          vivid: color.bg.fill.inverse-media-pressed
          inverse: color.bg.fill.on-inverse-pressed
          accent: color.bg.fill.on-accent-pressed
        secondary:
          default: comp.icon-button.secondary.bg.pressed
          inverse: color.bg.fill.inverse-pressed
          accent: color.bg.fill.neutral.subtle
        ghost:
          default: comp.icon-button.ghost.bg.pressed
          inverse: color.bg.fill.inverse-pressed
        plain:
          default: comp.icon-button.ghost.bg.pressed
          inverse: color.bg.fill.inverse-pressed
      overlay:
        danger: color.bg.fill.neutral.subtle
    selected:
      background:
        default: comp.icon-button.primary.bg.rest
        vivid: color.bg.fill.inverse-media
        inverse: color.text.on-inverse
        accent: color.text.on-accent
    disabled:
      opacity: opacity.disabled
    focus-visible:
      ring: color.border.focus
      ringWidth: border.focus
  icon:
    size:
      sm: size.icon.sm
      md: size.icon.md
      lg: size.icon.lg
    color:
      primary:
        default: comp.icon-button.primary.icon
        vivid: color.text.on-inverse-media
        inverse: color.bg.fill.inverse
        accent: color.bg.fill.accent
      secondary:
        default: comp.icon-button.secondary.icon
        inverse: color.text.on-inverse
        accent: color.text.on-accent
      ghost:
        default: comp.icon-button.ghost.icon
        vivid: color.text.on-vivid
        glass: color.text.on-glass-fill
        glassLight: color.text.on-glass-light
        inverse: color.text.on-inverse
        accent: color.text.on-accent
      plain:
        default: comp.icon-button.plain.icon
        vivid: color.text.on-vivid
        glass: color.text.on-glass-fill
        glassLight: color.text.on-glass-light
        inverse: color.text.on-inverse
        accent: color.text.on-accent-secondary
      danger: comp.icon-button.danger.icon
    selected:
      color:
        default: comp.icon-button.primary.icon
        vivid: color.text.on-inverse-media
        inverse: color.bg.fill.inverse
        accent: color.bg.fill.accent
  badge:
    offset: space.1

behavior:
  - Pressing fires `onPress` once on release inside the hit area; a drag outside cancels.
  - The hit region is the larger of the visual circle and size.hit on each axis (28 pt under pointer, 44 pt under touch); it extends invisibly around the circle, and the circle never grows with modality (ADR-0024 §7.3).
  - "`variant: plain` is the bare glyph: no fill, no ring, nothing but the glyph and that invisible hit region, which is why the region is not optional. It is the affordance Card pins to its top-right corner and the collapse glyph of a rail."
  - "`label` is required and is a real sentence, not the glyph's id: an icon-only control always carries a name, and that name is this string - never the glyph's registry entry, which nothing resolves (ADR-0011 rule 4 as ADR-0032 rule 6 reads it). It is the control's accessible name on every platform, under every modality and in every one of the cases below; nothing in the next clause reduces it."
  - "Prism has no Tooltip yet. Tooltip.yaml is a contract no stack implements, and it is not in this wave, so no behavior, token or state of this spec depends on one, and until it ships an IconButton shows no hint on hover or on focus on any platform, macOS included. Each hint a platform offers in a Tooltip's place also puts the name into the accessibility tree a second time. SwiftUI's `help` modifier sets the accessibility hint as well as the macOS help tag, and VoiceOver reads that hint after the name; the iPadOS pointer route writes the same hint; and on the web a `title` beside an accessible name is read twice by some screen readers. A hint equal to the name is the same sentence twice, and a hover-only hint is not an affordance in the first place (visual-dna §11 anti-pattern 31). Touch never had one. The name itself is not at risk anywhere: `label` reaches assistive technology on every platform and under every modality. What is lost is the name drawn on screen, and the cost is accepted for two users on macOS and web-desktop, where the old clause showed it on hover and on focus: a sighted pointer user gets no name on hover, and a sighted keyboard user, who saw it when focus reached the control, gets none on focus. Until Tooltip ships, the glyph alone identifies the control to both. When it ships, it is gated by interaction.tooltip, which will be bound here; it owes both users their name - on pointer rest and at once on `focus-visible`, as Tooltip.yaml already specifies - and this clause is replaced."
  - "`isSelected` renders the circle as the inverse solid whatever its variant, and a group holds exactly one selected circle - the active tool, the active view, the send button (visual-dna §1 principle 9 and §4.7). A selected circle renders as `primary` renders it in every state. It takes the `selected` cells, which are primary's cell for cell, with no ring and no underlay, and when pressed it takes primary's pressed fill, `pressed.background.primary`, as a pressed primary circle does. It is announced as selected: the selected trait on Apple, `aria-current=\"true\"` on the web. Its role stays `button`, and an unselected circle carries neither."
  - The circle is radius.control on a square box whose side is comp.icon-button.size.sm, .md or .lg; those follow density, so md is 32 pt on desktop, 40 pt on touch and 48 pt under the comfortable density (ADR-0024 §7.1).
  - The glyph is an Icon at size.icon.sm, .md or .lg; a control glyph is the md box, and the sm box belongs to `plain` corner glyphs (visual-dna §1 principle 13).
  - "On a vivid surface the primary and selected circles become the white solid (color.bg.fill.inverse-media with color.text.on-inverse-media), pressed color.bg.fill.inverse-media-pressed. On the scheme's glass and on light glass they stay the inverse solid of their default cells, ink on light glass and white on smoke, pressed comp.icon-button.primary.bg.pressed (ADR-0030 §3.1, ADR-0040 §1), and secondary keeps its raised puck. A ghost circle outlines in color.border.on-media on vivid and in color.border.on-glass-fill on both glasses, and the ghost and plain glyphs take that material's own foreground: color.text.on-vivid, color.text.on-glass-fill or color.text.on-glass-light."
  - "`danger` is a critical-tint circle with a critical glyph and a critical outline; on vivid, on the scheme's glass, on light glass, on inverse and on accent it paints the `underlay` cell, color.bg.page, as an opaque disc under its tint, so the pair the contrast gate checks is the pair that renders (visual-dna §4.11 note P1-9, ADR-0030 §1.8 and rule 6, ADR-0040 §3). On every other material there is no underlay cell and the tint composites over the surface itself."
  - The ghost rings on media (color.border.on-media, color.border.on-glass-fill, on the scheme's glass and on light glass) are decorative (ADR-0030 §3.2); the glyph is what identifies the control, which is why every IconButton carries one.
  - Hover is pointer-only and adds color.bg.fill.neutral.subtle over the circle; touch never shows a hover state (ADR-0010 rule 2). For `plain`, whose circle is otherwise invisible, the hover overlay and the pressed fill paint that circle at comp.icon-button.size.sm, .md or .lg - never the larger invisible hit region, which would make the wash jump with modality.
  - "Pressed scales the circle to 0.97 on motion.spring.snappy and returns on release (visual-dna §1 principle 9), and every variant but danger also takes its pressed fill, on every press and in every motion mode. Primary's, which a selected circle takes too, is one lightness step from its rest fill in every scheme (ADR-0039): comp.icon-button.primary.bg.pressed, and color.bg.fill.inverse-media-pressed over media, under the same glyph. Secondary takes the nested step, and ghost and plain the neutral wash. Danger, whose tint has no pressed cell, takes the pressed overlay of color.bg.fill.neutral.subtle over it instead, so no variant's press is carried by the scale alone."
  - IconButton plays one haptic per press, haptic.press.button on touch-down. A group that selects, such as TabBar, plays haptic.selection in its place, as Pagination.yaml replaces it.
  - "`isDisabled` lowers opacity to opacity.disabled and removes the control from the focus order; an unavailable action is better explained than disabled."
  - "An optional Badge, passed in the `badge` slot, is anchored space.1 outside the top-trailing corner of the circle, overlapping it - the `badge` part's `offset`, which is the host's because Badge applies no offset of its own; it never changes the hit region, never moves the glyph and is never focusable on its own - its count is read as part of the button's accessibility value, in the words Badge.yaml gives it: the `strings.Badge.count` sentence when the badge carries a `label`, and the locale-formatted count alone when it does not."
  - Buttons of one group share one size and one variant, apart from the single primary or selected circle (visual-dna §11 anti-pattern 24).
  - "On an inverse or an accent surface, which carry their own foreground, the one solid knocks out (ADR-0040 §3): a primary or selected circle fills with the material's primary foreground, color.text.on-inverse or color.text.on-accent, and its glyph takes the material's own fill, color.bg.fill.inverse or color.bg.fill.accent; pressed, it takes one lightness step of its own, color.bg.fill.on-inverse-pressed or color.bg.fill.on-accent-pressed. No other circle draws a ground of its own there: secondary drops its raised puck and rings as ghost does, in color.text.on-inverse, or color.text.on-accent-secondary on the tile, around a glyph in the material's foreground, and plain's glyph is color.text.on-inverse, or color.text.on-accent-secondary on the tile. Pressed on inverse, secondary, ghost and plain take color.bg.fill.inverse-pressed, one lightness step of the ground, where the neutral wash would composite to nothing; on the tile secondary takes color.bg.fill.neutral.subtle, the control wash of visual-dna §4.5, as ghost and plain already do. So a primary or selected circle never vanishes into an inverse ground, and on the dark lit tile it is ink, not a white solid at 2.30:1."

motion:
  press: motion.spring.snappy
  select: motion.spring.smooth
  reduceMotion: crossfade

haptics:
  press: haptic.press.button

accessibility:
  role: button
  label: the `label` prop, always explicit; a glyph id is never a name (ADR-0011 rule 4)
  traits: [button]
  keyboard: Space and Enter activate; the focus ring is color.border.focus at border.focus width outside the circle, following radius.control
  dynamicType: the circle and the glyph box do not scale with Dynamic Type - density is their lever - and the name is spoken rather than drawn, so nothing of it scales; a Tooltip, when Prism ships one, will scale with type.label.md
  contrast: "primary and selected are color.text.on-inverse on color.bg.fill.inverse, and on color.bg.fill.inverse-pressed while pressed; over media color.text.on-inverse-media on color.bg.fill.inverse-media, and on color.bg.fill.inverse-media-pressed while pressed; the ghost ring's colour on a solid ground, comp.icon-button.ghost.border, is color.border.strong, a boundary-tier pair (3:1) on page, surface and raised; the tier is a property of that colour and holds at any stroke width, so it says nothing about how wide the ring is, which is the `borderWidth` cell's alone - the colour color.border.strong and the width border.strong are two tokens that share a name and nothing else; danger is color.text.critical on color.bg.tint.critical, which is why the tint gets the color.bg.page underlay over media, on inverse and on accent, where the pair is checked with the page under it. Knocked out on inverse and accent, primary and selected are color.bg.fill.inverse on color.text.on-inverse and on color.bg.fill.on-inverse-pressed, and color.bg.fill.accent on color.text.on-accent and on color.bg.fill.on-accent-pressed, each also a functional pair of the circle against its ground; the other variants' glyphs and rings there are color.text.on-inverse on color.bg.fill.inverse and on color.bg.fill.inverse-pressed, and color.text.on-accent or color.text.on-accent-secondary on color.bg.fill.accent and on color.bg.fill.neutral.subtle over it, all functional (ADR-0040 §2). Every one of those pairs is in tokens/contrast-pairs.json. The secondary hairline is decorative, since the raised fill carries the step, and so are color.border.on-media and color.border.on-glass-fill, which ADR-0030 §3.2 gives no pair: the glyph is what identifies the control on those materials"
  reduceTransparency: not applicable (IconButton draws no material of its own); when the enclosing Surface falls back from glass to raised, the glass cells stop applying and the button renders its default cells, and when a selected glass Surface falls back to inverse the button takes its inverse cells, a primary or selected circle knocked out (behavior)
  reduceMotion: the press scale is replaced by the variant's pressed cell over motion.duration.base with motion.easing.out - comp.icon-button.primary.bg.pressed for primary and a selected circle, or color.bg.fill.inverse-media-pressed on vivid, color.bg.fill.on-inverse-pressed on inverse and color.bg.fill.on-accent-pressed on accent, comp.icon-button.secondary.bg.pressed for secondary, comp.icon-button.ghost.bg.pressed for ghost and plain, color.bg.fill.inverse-pressed for all three on inverse and color.bg.fill.neutral.subtle for secondary on accent, and the pressed overlay of color.bg.fill.neutral.subtle for danger, which has no pressed fill. Every variant therefore shows a press with no scale at all, primary and selected as one lightness step (ADR-0039). Selection crossfades to the inverse solid instead of scaling

usage:
  do:
    - Give every IconButton a verb-first name ("Refresh readings"); it is the accessible name everywhere.
    - Keep one solid among the rings - one primary or one selected circle per group (visual-dna §4.7).
    - Use `plain` where the glyph sits on a card corner or inside a dense row, and give it the full hit region.
  dont:
    - Don't use an IconButton where the action needs a word; that is a Button.
    - Don't put two filled circles in one toolbar, and don't fill a track behind a group of them.
    - Don't rely on hover to reveal the button or its name; a hover-only affordance does not exist on touch (visual-dna §11 anti-pattern 31).

examples:
  - id: secondary-md
    props: { variant: secondary, size: md, glyph: action.settings, label: "Open settings" }
  - id: primary-md
    props: { variant: primary, size: md, glyph: action.add, label: "Add a site" }
  - id: ghost-md
    props: { variant: ghost, size: md, glyph: action.filter, label: "Filter results" }
  - id: plain-sm
    props: { variant: plain, size: sm, glyph: nav.open, label: "Open details" }
    description: the corner affordance of a Card, whose hit region is 44 pt under touch
  - id: danger-md
    props: { variant: danger, size: md, glyph: action.delete, label: "Delete route" }
  - id: selected-in-group
    props: { variant: ghost, size: md, glyph: object.map, label: "Map view", isSelected: true }
    description: the one selected circle in a view switcher; its siblings stay hairline rings
  - id: lg-touch
    props: { variant: primary, size: lg, glyph: action.play, label: "Start the run" }
  - id: disabled
    props: { variant: secondary, size: md, glyph: action.refresh, label: "Refresh readings", isDisabled: true }
  - id: on-vivid
    props: { variant: ghost, size: md, glyph: nav.open, label: "Open the yield card" }
    surface: vivid
  - id: on-glass-over-map
    props: { variant: primary, size: md, glyph: action.locate, label: "Center on the vehicle" }
    surface: glass
    backdrop: map
  - id: label-ru
    props: { variant: secondary, size: md, glyph: action.refresh, label: "Обновить показания линии" }
    description: a long Russian name, which is spoken and never drawn, so the circle does not change
  - id: with-badge
    props: { variant: secondary, size: md, glyph: object.notification, label: "Open notifications", badge: { variant: count, tone: neutral, count: 3, label: "unread" } }
    description: the badge slot filled - a count Badge anchored space.1 outside the circle's top-trailing corner, hidden itself and read into the button's accessibility value, "3 unread"

notes:
  platform:
    watchos: "none. ADR-0010's Tier 3 list has no IconButton: the watch acts through Button, whose sizes collapse to lg, and through system chrome. A nameless 44 pt circle in a one-column stack of at most three tiles would spend the whole width on a tap target without a word."
    macos: Hover is required and the default size follows compact density (32 pt); no system help tag is attached until Prism has a Tooltip (behavior), and the focus ring uses the system color when Increase Contrast is on.
    web-desktop: Built on the same React Aria Button as Button; `onPress`, not `onClick`, and `data-pressed` / `data-hovered` / `data-ds-selected` drive the CSS states (ADR-0019); a button has no accessibility value on the web, so the badge's contribution follows `label` in the accessible name after a comma (`Open notifications, 3 unread`), as VoiceOver reads a label and then its value.
  design: >-
    The circle-and-ring grammar, the one solid among hairlines and the 0.97 press come from
    docs/research/visual-dna.md §1 principles 2, 9 and 13 and §4.7; the bare glyph, the raised puck, the
    glass circle over a map and the badge are the variants docs/research/component-inventory.md records
    for IconButton (11 of 11 shots). The glyph prop is named `glyph`, not `icon`, because ADR-0022 rule 8
    forbids a vivid example from setting `icon` - a ring drawn around a glyph on a gradient - and an
    IconButton's glyph is exactly the element that rule is not about. Example strings are invented
    (ADR-0015 rule 3).
  references: [docs/adr/0010-platform-tiers-density-modality.md, docs/adr/0011-accessibility-tiers-ci.md, docs/adr/0023-motion-tokens.md, docs/adr/0024-token-source-conventions.md, docs/adr/0029-direction-board-sign-off.md, docs/adr/0030-semantic-roles-from-the-direction-board.md, docs/adr/0032-component-owned-strings.md, docs/adr/0039-the-pressed-solid.md, docs/adr/0040-materials-a-part-keys.md]
