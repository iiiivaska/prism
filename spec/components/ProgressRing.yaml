name: ProgressRing
layer: primitive
specVersion: 1
status: draft
summary: >-
  A closed ring that shows a fraction of a whole at control size: a quiet track with the value arc
  drawn over it in the inverse solid, round caps, and optionally the bare percent inside.
  It also carries the indeterminate case, where the arc is the 270 degree open sweep turning at a
  constant rate. It is the wrist's form of progress and the only one on ADR-0010's Tier 3 list.
since: 0.1.0

platforms:
  ios: full
  ipados: full
  macos: full
  watchos: adapted
  web-touch: full
  web-desktop: full
density: [compact, regular, comfortable, watch]
modality: [pointer, touch]
schemes: [light, dark]

anatomy:
  - part: root
  - part: track
    description: the full circumference at the quiet weight, drawn under the arc
  - part: arc
    description: the value arc, drawn clockwise from the top with round caps
  - part: value
    optional: true
    description: the bare percent numeral inside the ring; the ring draws no unit of its own

props:
  - name: variant
    type: enum
    values: [determinate, indeterminate]
    default: determinate
  - name: value
    type: number
    default: 0
    description: the filled fraction, clamped to 0 through 1; ignored when indeterminate
  - name: size
    type: enum
    values: [sm, md, lg]
    default: md
  - name: showValue
    type: boolean
    default: false
    description: renders the whole percent inside the ring; ignored at size sm and on a surface that publishes vivid
  - name: label
    type: string
    description: what is being measured; it becomes the accessibility label and is required when nothing beside the ring names the work

states: [default]

tokens:
  root:
    size:
      sm: size.control.sm
      md: size.control.md
      lg: size.control.lg
    strokeRatio: chart.gauge-stroke-ratio
    strokeMin: comp.progress-ring.stroke-min
  track:
    color:
      default: comp.progress-ring.track
      vivid: color.chart.on-media.grid
      glass: color.chart.on-glass-fill.grid
  arc:
    color:
      default: comp.progress-ring.arc
      vivid: color.bg.fill.inverse-media
      glass: comp.progress-ring.arc
  value:
    typography: type.data
    color:
      default: color.text.primary
      inverse: color.text.on-inverse
      accent: color.text.on-accent
      glassLight: color.text.on-glass-light
      glass: color.text.on-glass-fill

behavior:
  - The determinate ring is closed, because it shows a fraction of a whole (dataviz-design.md §3 E24). The arc starts at the top and runs clockwise, with round caps, so a value just above 0 shows a dot rather than a sliver.
  - "The outer diameter is `size.control.sm`, `.md` or `.lg`, so a ring belongs to the same control family as a Button or an IconButton and shares its height in every density."
  - "The stroke is `chart.gauge-stroke-ratio` (0.05) of the diameter, never below `comp.progress-ring.stroke-min` (4 px, dataviz-design.md §3 E25). At control diameters the floor governs; the ratio takes over only when a product draws the ring at card scale, and a hairline track with only the arc weighted is RingGauge's question, not this component's."
  - "`variant` indeterminate ignores `value`. The track is still drawn — that is what tells an indeterminate ring from a Spinner, which has none — and over it runs the 270 degree open sweep of dataviz-design.md §3 E24, turning one revolution per `motion.duration.slower` with `motion.easing.linear`, which ADR-0023 §9 reserves for constant motion."
  - "`showValue` is allowed at `size` md and lg and is ignored at sm. dataviz-design.md §3 E25 caps the numeral at 45 % of the diameter: `size.control.md` is 32, 40, 48 and 40 px across the four densities and `size.control.lg` 40, 44, 52 and 44, so the cap is 14.4 px at worst and `type.data` (13 px) fits everywhere; `size.control.sm` at compact density gives 12.6 px and does not. `type.metric.md` (20 px) fits no control diameter at all, which is why the inner numeral is not a metric role."
  - "The inner numeral is the whole percent with no sign and no unit: at control size E25's unit rule (40 to 50 % of the numeral) would ask for a 6 px glyph. A unit, and anything else the reader needs in words, sits in the Text beside the ring. The numeral is `type.data`, which is tabular (ADR-0021 §5), so it does not jitter as the ring fills; it replaces its value and never counts up (Text.yaml)."
  - The ring never carries a second colour for a threshold. Bands and qualitative ranges belong to RingGauge, and a status is carried by an icon and a label, never by recolouring the arc.
  - On a surface that publishes `vivid` the arc flips to the white solid `color.bg.fill.inverse-media` over a `color.chart.on-media.grid` track; on the scheme's glass it keeps `comp.progress-ring.arc`, which is the inverse solid ADR-0030 §3.1 already makes right there (ink on light glass, white on smoke), over the glass grid.
  - "On a surface that publishes `vivid` the ring draws no numeral: `type.data` is 13 px, and outside the Card header block `color.text.on-vivid` is checked only at 24 px and above (ADR-0022 V1 and V2). `showValue` is ignored there and the enclosing Card's caption carries the words, the way it carries the hero's unit (ADR-0030 §8)."
  - Reaching 1 plays no haptic. The haptics registry allows at most one haptic per user action and none on a programmatic state change.
  - The ring is a readout, never a control. A ring the user can drag is a Slider, and a ring that opens something sits inside a Button.

motion:
  value: motion.spring.smooth
  rotation: motion.duration.slower
  rotationEasing: motion.easing.linear
  reduceMotion: instant

accessibility:
  role: progressbar (indeterminate rings expose no value)
  label: from `label`; it states the work, not the percentage ("Battery charge", "Uploading")
  traits: [updatesFrequently]
  keyboard: not focusable and not a tab stop; the ring is a readout and the control that started the work keeps the focus
  dynamicType: the ring's diameter does not scale, because it belongs to the control family; the inner numeral scales with `type.data` and, once it would pass 45 % of the diameter, it is dropped and the value is read from the Text beside the ring instead of shrinking or clipping
  contrast: "the arc against the track is a mark that carries meaning, so it holds the 3:1 boundary tier of ADR-0011 while it is drawn at full strength; `comp.progress-ring.arc` is `color.bg.fill.inverse` (ink in light, white in dark) over `comp.progress-ring.track`, which is `color.bg.fill.neutral.subtle`, 17.0:1 in light. On vivid the white solid `color.bg.fill.inverse-media` against every gradient sample is ADR-0022's V1. The static ring an indeterminate variant shows under Reduce Motion is dimmed to `opacity.dimmed-row` and is decoration at that point: it carries no tier, which is why the label and the text beside the ring carry the state there. `value` is functional text below 24 px and follows the tones of Text on the published material, which is why it is not drawn on vivid"
  voiceOver: "a determinate ring exposes the fraction as a percent from 0 to 100 (`aria-valuemin` 0, `aria-valuemax` 100, `aria-valuenow` the rounded percent on web; `accessibilityValue` on Apple). An indeterminate ring sets no value at all (`aria-valuenow` absent, an indeterminate `Gauge` on Apple), so a screen reader says busy rather than a number"
  reduceTransparency: not applicable — the ring renders no glass of its own; when the enclosing Surface falls back from glass to `raised`, the ring takes its `default` cells with it
  reduceMotion: "the indeterminate rotation is an ambient loop and does not run (ADR-0023 §8.4, `instant`): the ring draws its complete circumference in `comp.progress-ring.arc` at `opacity.dimmed-row` and the work is named by the accessibility label and by the text beside it. A determinate arc keeps `motion.spring.smooth` for in-place movement, which carries no bounce and settles in 440 ms under Reduce Motion, and the inner numeral never counts up"

usage:
  do:
    - Use a ring where the value is a fraction of a known whole and the space is the size of a control.
    - Name the work beside the ring, so the progress survives Reduce Motion, a screen reader and a screenshot.
    - Put the unit and the words in the Text beside the ring; the ring holds a bare numeral or nothing.
  dont:
    - Don't colour the arc with the accent or a status hue; ink and white carry the data, and a failure is an icon with a label.
    - Don't band or segment the ring for thresholds; that is RingGauge, in the data-viz wave.
    - Don't show a value inside an `sm` ring; below the 45 % limit the numeral is too small to be functional text.
    - Don't put a ring on a vivid gradient's lightest stop or over its bloom.

examples:
  - id: determinate-md
    props: { variant: determinate, value: 0.62, size: md, label: "Uploading route file" }
  - id: determinate-lg-value
    props: { variant: determinate, value: 0.86, size: lg, showValue: true, label: "Battery charge" }
    description: the bare percent inside the ring; the word and any unit belong to the Text beside it
  - id: determinate-sm
    props: { variant: determinate, value: 0.25, size: sm, label: "Sync" }
  - id: indeterminate
    props: { variant: indeterminate, size: md, label: "Checking connection" }
  - id: complete
    props: { variant: determinate, value: 1, size: lg, showValue: true, label: "Sync complete" }
  - id: on-vivid
    props: { variant: determinate, value: 0.5, size: md, label: "Batch progress" }
    surface: vivid
    description: the ring alone; on vivid `showValue` is ignored and the card's caption carries the words
  - id: on-glass-over-map
    props: { variant: determinate, value: 0.35, size: md, label: "Route recalculated" }
    surface: glass
    backdrop: map
  - id: ru-label
    props: { variant: determinate, value: 0.4, size: lg, showValue: true, label: "Заряд аккумулятора" }
    description: a Russian label roughly twice the length of "Battery charge"; it sits beside the ring and wraps, and the ring keeps its diameter

notes:
  platform:
    watchos: "`adapted`. Determinate only, `size` lg; the ring maps to SwiftUI's circular Gauge, and dataviz-design.md §3 H47 keeps the wrist glanceable. On the watch vivid resolves to solid and glass takes the opaque `raised` fallback (Surface.yaml), so only the `default` cells apply. The watch density gives `size.control.lg` 44 px, whose 45 % cap is 19.8 px, so `type.data` still fits inside; the 4 px stroke floor is stricter than E25's 2 pt watch minimum, which is safe."
    macos: identical to iOS; the ring has no hover state, because it is not interactive.
  design: "The ring geometry is dataviz-design.md §3 E24 (closed for a fraction of a whole, the 270 degree open sweep otherwise), E25 (stroke ratio with a 4 px floor, round caps, the value inside at 45 % of the diameter) and E26 (no hue for thresholds), with the stroke ratio at ADR-0030 §2.5's 0.05. E25's 45 % cap is what keeps the inner numeral at `type.data` rather than a metric role: no control diameter in any density leaves room for `type.metric.md`, and the hung unit of §1 principle 4 belongs to the Text beside the ring, not inside it. The inverse-solid arc and the white flip on media are docs/research/visual-dna.md §1 principle 9 and §4.7, and the control diameters are ADR-0024 §7. docs/research/component-inventory.md records ProgressRing with 0 of 11 sightings and on ADR-0010's Tier 3 list, so the form comes from the rulebook rather than from a shot. Example strings are invented (ADR-0015 rule 3)."
  references: [docs/adr/0010-platform-tiers-density-modality.md, docs/adr/0011-accessibility-tiers-ci.md, docs/adr/0023-motion-tokens.md, docs/adr/0024-token-source-conventions.md, docs/adr/0030-semantic-roles-from-the-direction-board.md]
