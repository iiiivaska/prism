name: StatCard
layer: composite
specVersion: 1
status: draft
summary: >-
  One metric wearing card chrome: a Card whose hero is a number. It is the most common card in the
  references — title and caption top-left, one action top-right, the value bottom-left, meta or a mini
  chart bottom-right. StatCard adds the metric, the delta, the chart slots and the loading hold; the
  chrome, the materials and the corner-pinned anatomy are Card's and are not restated here. A metric
  with no chrome at all is a StatTile.
since: 0.1.0

platforms:
  ios: full
  ipados: full
  macos: full
  watchos: none
  web-touch: full
  web-desktop: full
density: [compact, regular, comfortable]
modality: [pointer, touch]
schemes: [light, dark]

anatomy:
  - part: root
    description: a Card; StatCard passes it the material, the title, the caption, the icon and the action and adds no chrome of its own
  - part: hero
    description: the Card's hero — the value, its dimmed trailing group and its hung unit
  - part: delta
    optional: true
    slot: true
    description: one DeltaBadge on the hero's baseline
  - part: aside
    optional: true
    slot: true
    description: the Card's aside — meta text, or one Sparkline or RingGauge passed in by the caller
  - part: footer
    optional: true
    slot: true
    description: a full-width strip under the body — a chart or a small table, inside the card padding
  - part: badge
    optional: true
    slot: true
    description: one Badge anchored outside the corner of the Card's icon ring

props:
  - name: variant
    type: enum
    values: [solid, vivid, glass, tinted]
    default: solid
    description: forwarded to Card unchanged
  - name: vivid
    type: enum
    values: ["1", "2", "3", "4"]
    description: forwarded to Card unchanged; unset, a vivid card takes the default gradient
  - name: title
    type: string
    required: true
    description: forwarded to Card
  - name: caption
    type: string
    description: forwarded to Card; on vivid it also carries the metric's unit (V3)
  - name: icon
    type: icon
    description: forwarded to Card; not drawn on vivid
  - name: action
    type: enum
    values: [none, open, custom]
    default: open
    description: forwarded to Card
  - name: onAction
    type: action
    description: forwarded to Card
  - name: value
    type: string
    required: true
    description: the significant digits; StatCard builds Card's `hero` from `value`, `trailing` and `unit`
  - name: trailing
    type: string
    description: the insignificant tail — decimals, a thousands remainder, a denominator ("/38") — dimmed at the same size
  - name: unit
    type: string
    description: hung on the value's baseline; on vivid it moves into `caption` instead
  - name: size
    type: enum
    values: [compact, regular, large]
    default: regular
    description: forwarded to Card, and it selects the hero's type role
  - name: isLive
    type: boolean
    default: false
    description: sets tabular figures on the hero, as every value that changes while visible must
  - name: delta
    type: data
    description: DeltaBadge props; its `value` is the bare magnitude, because the badge writes the sign and the basis itself
  - name: aside
    type: slot
  - name: footer
    type: slot
  - name: badge
    type: slot
  - name: backdrop
    type: enum
    values: [none, image, map, vivid]
    default: none
    description: forwarded to Card
  - name: isSelected
    type: boolean
    default: false
    description: forwarded to Card
  - name: isLoading
    type: boolean
    default: false

states: [default, hover, pressed, selected, focus-visible, loading]

tokens:
  root:
    gap: space.4
    loading:
      opacity: opacity.dimmed-row
  hero:
    typography:
      default: type.metric.lg
      large: type.metric.xl
    gap: space.2
  delta:
    gap: space.3
  aside:
    gap: space.3
  footer:
    gap: space.5
  badge:
    offset: space.1

behavior:
  - "StatCard is a Card. The material, the radius, the padding, the corner-pinned anatomy, the hover overlay, the press, the selection cue and the glass fallback are Card's and are not restated here; StatCard forwards `variant`, `vivid`, `title`, `caption`, `icon`, `action`, `onAction`, `size`, `backdrop` and `isSelected` to it unchanged."
  - "What StatCard adds is the metric: it builds Card's `hero` from `value`, `trailing` and `unit`, and it adds the `delta`, `aside`, `footer` and `badge` slots and the loading hold."
  - "The hero is type.metric.lg at every size but `large`, which is the screen's lead figure and takes type.metric.xl. A screen carries one hero numeral (docs/research/visual-dna.md §11 anti-pattern 25), so at most one StatCard per screen is `size: large`."
  - "The trailing group is the insignificant tail at the hero's own size in Text's dimmed tone, never a smaller type — a denominator is written `value: \"24\"` with `trailing: \"/38\"`, not as a second role. Dimming exists only at 24 px and above (ADR-0011), and the hero clears that at every size — type.metric.lg is 32 px at `compact` and `regular`, type.metric.xl is 48 px at `large` — so the trailing group is legal on every StatCard. `size` changes the card's padding, its radius and the hero's role at `large`; it never shrinks the hero below type.metric.lg."
  - "The unit hangs on the value's baseline in type.metric.unit, space.2 from it. On a vivid surface it moves into the caption: the hero block there holds only the value, which V1 covers at 24 px and above, and the header block is what V2 covers at the functional tier (ADR-0030 §8, V3)."
  - "`isLive: true` sets tabular figures on the hero, as ADR-0021 §5 requires of every value that changes while visible; a static hero keeps the role's proportional figures."
  - "The delta sits after the hero on its baseline, space.3 from it; it is a DeltaBadge the caller passes in, and StatCard neither writes its sign nor colours it. A positive delta stays neutral (docs/research/visual-dna.md §1 principle 3)."
  - "The aside is the Card's bottom-right slot, baseline-locked to the hero. A composite may not import data-viz (ADR-0012 rule 1), so a Sparkline or a RingGauge reaches it as a slot the caller fills, the way Card.yaml already makes `aside` a slot."
  - "The footer is a full-width strip under the body, space.5 below the hero row and inside the card padding, for a chart or a short table. It is drawn only at `size: regular` and `large`; a footer passed to a `size: compact` card is not drawn at all, because a compact card has no room for one."
  - "A new value replaces the old by crossfading the hero in place over `motion.valueChange` (motion.duration.slow): the numeral does not count up, does not roll and does not move its baseline, so a card in a grid never makes its neighbours wait for it to settle. The trailing group and the unit change with it, in the same crossfade."
  - "On vivid the footer and the aside hold a sparkline, a glyph or text of 24 px and above, the icon ring is not drawn and the badge is not drawn: nothing under 24 px sits outside the header block there (ADR-0022 §4.2, ADR-0030 rule 7)."
  - "`isLoading` holds the previous render at opacity.dimmed-row and keeps the title, the caption and the hero's box in place; the card never swaps in a Skeleton, which would flash the grid on every refetch. A card with no value yet shows a Skeleton once, before its first value."
  - "A missing value renders an em dash in the hero role; the title, the caption and the unit stay, so the grid keeps its shape."
  - "The badge is a Badge anchored space.1 outside the corner of the Card's icon ring; it never changes the card's layout, never takes focus and its count is read as part of the card's label. A card with no icon has no badge."
  - "The card keeps one action, Card's (docs/research/visual-dna.md §4.9): a button row inside a card is anti-pattern 24, and a card that needs two actions is a detail screen."
  - "Sibling StatCards on one screen share the hero baseline row and the action inset, so a grid of them reads as one instrument (§1 principle 12)."

motion:
  press: motion.spring.snappy
  valueChange: motion.duration.slow
  reduceMotion: instant

haptics:
  press: haptic.press.button

accessibility:
  role: the Card's — button while the card is pressable, otherwise group
  label: title, caption, value, unit and the delta's reading as one string ("Line output, last 24 hours, 86.4 percent, up 0.8 points"); the aside and the footer are folded in rather than exposed separately, and the badge's count is read after the title
  traits: [button]
  keyboard: the Card's — focusable while pressable, Enter activates, and the focus ring is color.border.focus at border.focus width following the card's radius; the footer's own controls are separate focus stops after the card
  dynamicType: title, caption, unit and delta scale; the hero clamps at the accessibility3 size and the card grows in height, dropping first the footer, then the aside, before any text shrinks
  contrast: "the hero is large text at the 3:1 tier at type.metric.lg (32 px) and type.metric.xl (48 px), and the trailing group is the dimmed tone, which ADR-0011 allows only at 24 px and above. Title, caption and every quieter tone follow the material the Card publishes, and on the scheme's glass also its backdrop kind (ADR-0029 §1.4); on vivid the only color.text.on-vivid pairs are V1, at 24 px and above, and V2, the header block, which is why the unit joins the caption there. The delta, the aside and the footer carry their own components' pairs"
  reduceTransparency: no change of its own — Card resolves glass to the opaque raised fallback, or to inverse while the card is selected, and every tone follows the published material
  reduceMotion: the value does not count up or roll; it is replaced at motion.duration.instant, the sparkline in the aside appears complete, and the press scale is replaced by Card's fill change to color.bg.fill.neutral.subtle over motion.duration.base with motion.easing.out

usage:
  do:
    - Use a StatCard for one number that needs a name, a period and a way in.
    - "Put the trend in the aside and the history in the footer, never both at `size: compact`."
    - Keep the unit in the caption on a vivid card, and the value alone in the hero.
    - Use `isLive` for anything that changes while it is on screen.
  dont:
    - Don't put a second number in the hero; a second metric is a second card or a StatTile grid.
    - Don't set a smaller type for a denominator; it is the hero's dimmed trailing group.
    - Don't add a button row, a second action or a filter inside the card.
    - Don't use a StatCard where there is no chrome to carry — a bare label and value is a StatTile.

examples:
  - id: solid-metric
    props: { variant: solid, title: "Line output", caption: "Last 24 hours", value: "86", trailing: ".4", unit: "%" }
  - id: with-denominator
    props: { variant: solid, title: "Invoices paid in full", caption: "This quarter", value: "24", trailing: "/38" }
    description: the denominator is the hero's dimmed trailing group, at the hero's own size
  - id: with-delta
    props: { variant: solid, title: "Conversion", caption: "Last 7 days", value: "12", trailing: ".9", unit: "%", delta: { value: "0.8", direction: up, polarity: upIsGood, basis: points } }
  - id: with-trend-aside
    props: { variant: solid, title: "Ingest rate", caption: "Last hour", value: "1 284", unit: "req/s", isLive: true }
    description: the aside slot holds one Sparkline at the card's aside height, baseline-locked to the hero
  - id: with-chart-footer
    props: { variant: solid, size: large, title: "Line output", caption: "Last 24 hours", value: "86", trailing: ".4", unit: "%" }
    description: "the footer slot holds a ChartContainer; the hero is type.metric.xl at `size: large`"
  - id: with-alert-badge
    props: { variant: solid, title: "Pump 4 pressure", caption: "Line two", value: "2", trailing: ".1", unit: "bar", icon: object.gps }
    description: the badge slot holds a critical Badge on the icon ring; the caption names the state in words
  - id: compact
    props: { variant: solid, size: compact, title: "Queued", value: "37" }
  - id: vivid-kpi
    props: { variant: vivid, title: "Average yield", caption: "Roubles per batch", value: "2 450" }
    description: the unit sits in the caption, because the hero block on vivid holds only the value
  - id: vivid-pair
    props: { variant: vivid, size: compact, title: "Average yield", value: "2 450" }
    grid: ["1", "2", "2", "1"]
    description: a 2x2 of vivid stat cards, one slot pair on the diagonals
  - id: glass-over-map
    props: { variant: glass, backdrop: map, title: "Unit 4417", caption: "Battery", value: "63", unit: "%" }
    surface: map
  - id: tinted-focus
    props: { variant: tinted, title: "Sensor uptime", caption: "Last 30 days", value: "99", trailing: ".2", unit: "%" }
    schemes: [light]
  - id: loading
    props: { variant: solid, title: "Line output", caption: "Last 24 hours", value: "86", trailing: ".4", unit: "%", isLoading: true }
  - id: russian-title
    props: { variant: solid, title: "Средняя выработка за смену", caption: "Рублей на партию", value: "2 450" }
    description: the Russian title runs about a third longer and wraps to the two lines the header block allows, and the hero keeps its baseline

notes:
  platform:
    watchos: "`none`. ADR-0010 fixes the Tier 3 list, and StatCard is not on it: the wrist gets \"a glanceable Card\" and StatTile, which docs/research/component-inventory.md's watch table reads as \"corner-pinned anatomy cut down to a title and a hero\" and \"the status tile (icon, label, large number)\". Card already draws that cut-down form through its own `hero` prop, so a watch StatCard would add nothing but a second name for it, while every slot this spec adds — the delta, the aside, the footer and the badge — is exactly what the watch drops. Tier 3 membership is not inherited from the component a composite wraps. This is a decision, not a gap: a metric on the wrist is a StatTile, or a Card with a hero, in a stack of at most three (spec/patterns/README.md)."
    macos: "hover overlay on solid and tinted cards, compact density for the padding and the gaps, and the footer's controls are reachable with the keyboard before the card's own action."
    web-desktop: "the footer renders the desktop Table when it carries rows; `data-loading` drives the hold at opacity.dimmed-row."
  design: >-
    Eight of eleven shots carry a StatCard (docs/research/component-inventory.md), which also draws the
    line this spec follows: card chrome around one metric is a StatCard, a bare metric is a StatTile. The
    anatomy is docs/research/visual-dna.md §4.9 and belongs to Card.yaml; what is added here is the metric
    of §4.2 and §6.6 (card hero type.metric.lg, screen hero type.metric.xl, the dimmed trailing group and
    the hung unit at space.2). Five of the eight sightings put a chart inside, which ADR-0012 rule 1 turns
    into the `aside` and `footer` slots rather than an import. The dimmed denominator of the light
    dashboard sighting becomes the hero's trailing group instead of a smaller role, because dimming exists
    only at 24 px and above (ADR-0011) and because §1 principle 4 dims the insignificant part at the same
    size rather than shrinking it. The alert badge on an icon ring is the Badge sighting of the same file.
    Example strings are invented (ADR-0015 rule 3).
  references:
    - docs/adr/0010-platform-tiers-density-modality.md
    - docs/adr/0011-accessibility-tiers-ci.md
    - docs/adr/0012-layers-and-v1-scope.md
    - docs/adr/0015-references-inspiration-only.md
    - docs/adr/0021-typography-rules.md
    - docs/adr/0022-materials-and-fallbacks.md
    - docs/adr/0029-direction-board-sign-off.md
    - docs/adr/0030-semantic-roles-from-the-direction-board.md
