name: Card
layer: composite
specVersion: 1
status: draft
summary: >-
  The corner-pinned card: a Surface with a fixed anatomy (title and caption top-left, one action or
  the open affordance top-right, hero content bottom-left, meta or a mini chart bottom-right) in solid,
  vivid or glass materials. Most screens in the references are grids of this card.
since: 0.1.0

platforms:
  ios: full
  ipados: full
  macos: full
  watchos: adapted
  web-touch: full
  web-desktop: full
density: [compact, regular, comfortable]
modality: [pointer, touch]
schemes: [light, dark]

anatomy:
  - part: root
    description: a Surface
  - part: header
  - part: title
  - part: caption
    optional: true
  - part: iconRing
    optional: true
    description: 44 px hairline ring with a 20 px icon, top-left, above the title
  - part: action
    optional: true
    description: top-right affordance; either the nav.open glyph or one solid circular IconButton
  - part: body
    slot: true
  - part: hero
    optional: true
    description: bottom-left metric (Text role metric-lg) with trailing group and unit
  - part: aside
    optional: true
    slot: true
    description: bottom-right meta or a Sparkline, baseline-locked to the hero

props:
  - name: variant
    type: enum
    values: [solid, vivid, glass, tinted]
    default: solid
  - name: vivid
    type: enum
    values: [orchid, olive, rose, sky, ember-night, plum-dusk, forest-moss, navy-cyan]
  - name: title
    type: string
    required: true
  - name: caption
    type: string
  - name: icon
    type: icon
  - name: action
    type: enum
    values: [none, open, custom]
    default: open
  - name: onAction
    type: action
  - name: hero
    type: data
    description: "{ value, trailing?, unit?, tone? } rendered with Text metric-lg"
  - name: size
    type: enum
    values: [compact, regular, large]
    default: regular
  - name: backdrop
    type: enum
    values: [none, image, map, vivid]
    default: none
  - name: isSelected
    type: boolean
    default: false

states: [default, hover, pressed, selected, focus-visible]

tokens:
  root:
    background:
      solid: comp.card.solid.bg
      tinted: color.bg.tint.accent
      glass: comp.card.glass.fill
    gradient:
      vivid: gradient.vivid.orchid
    radius:
      compact: comp.card.radius.compact
      regular: comp.card.radius.regular
      large: comp.card.radius.large
    padding: comp.card.padding
    shadow:
      solid: comp.card.shadow.solid
      glass: comp.card.shadow.floating
    selected:
      background: material.glass.light.fill
    hover:
      overlay: color.bg.fill.neutral.subtle
  title:
    typography: type.headline
    color:
      solid: comp.card.solid.text
      vivid: comp.card.vivid.text
      glass: comp.card.glass.text
  caption:
    typography: type.caption
    color:
      solid: comp.card.solid.caption
      vivid: comp.card.vivid.caption
      glass: color.text.on-glass
  iconRing:
    size: size.icon.ring
    border: color.border.hairline
    iconSize: size.icon.md
  action:
    size: size.control.md
    iconSize: size.icon.sm
    color:
      solid: color.icon.secondary
      vivid: color.text.on-vivid
  hero:
    typography: type.metric.lg
  aside:
    gap: space.3

behavior:
  - The card is a Surface of the chosen material; `glass` requires `backdrop` image, map or vivid or it resolves to solid.raised.
  - Header pins to the top-left with the action at the padding corner top-right; hero pins bottom-left; aside pins bottom-right and shares the hero's baseline; the middle may be empty and the card keeps its declared aspect.
  - "`action: open` renders the nav.open glyph at 16 px in the secondary icon color and makes the whole card pressable; `custom` renders one solid circular IconButton and only that button is pressable."
  - "`isSelected` on glass switches to the light glass material with the bloom clipped away from the header text block."
  - Vivid cards render their bloom behind themselves; at most one 2×2 vivid grid or one vivid card in six per screen (enforced by the pattern spec, warned by the gallery lint).
  - Hover (pointer) adds the neutral overlay on solid; vivid and glass do not change on hover.
  - Compact density uses radius.compact and 16 px padding; large size uses radius.large for cards with a side of 200 px or more.

motion:
  press: motion.spring.snappy
  select: motion.spring.smooth
  reduceMotion: crossfade

haptics:
  press: haptic.press.button

accessibility:
  role: button when pressable, otherwise group
  label: title plus caption plus hero value ("Line output, last 24 hours, 86.4 percent")
  traits: [button]
  keyboard: focusable when pressable; Enter activates; focus ring follows the card radius at 2 px
  dynamicType: title and caption scale; hero clamps at accessibility3; the aside wraps below the hero when both cannot fit
  contrast: title and caption on solid use text.primary/secondary; on vivid the header must sit in the gradient's declared text-safe zone; on glass captions are ≥ 78 % white or a scrim is added (tools/contrast checks both backdrops)
  reduceTransparency: glass resolves to solid.raised; bloom dropped
  reduceMotion: press scale replaced by an opacity dip; selection crossfades

usage:
  do:
    - "Keep the anatomy: title top-left, action top-right, hero bottom-left; let the middle breathe."
    - Use vivid for the one thing the screen sells (a 2×2 grid of KPIs, one hero card).
    - Put a Sparkline in the aside when the hero has a trend.
  dont:
    - Don't put a button row inside a card; a card has one action.
    - Don't mix radii within one card family on a screen.
    - Don't place captions or hairlines on the bloom or the lightest stop of a vivid card.

examples:
  - id: solid-metric
    props: { variant: solid, title: "Line output", caption: "Last 24 hours", hero: { value: "86", trailing: ".4", unit: "%" } }
  - id: vivid-orchid-kpi
    props: { variant: vivid, vivid: orchid, title: "Average yield", hero: { value: "$2,450", unit: "/batch" } }
  - id: glass-vehicle
    props: { variant: glass, backdrop: image, title: "Unit 4417", caption: "21.11.2026, 14:05:22" }
    surface: image
  - id: glass-selected
    props: { variant: glass, backdrop: image, title: "Unit 4417", isSelected: true }
    surface: image
  - id: tinted-focus
    props: { variant: tinted, title: "Sensor", caption: "Active", icon: object.gps }
  - id: compact
    props: { variant: solid, size: compact, title: "Queued", hero: { value: "37" } }

notes:
  platform:
    watchos: solid only, compact size, no aside; the card is a full-width row.
    macos: "hover overlay on solid cards; the action glyph appears on hover only when `action: open` (always visible on touch)."
  design: Corner-pinned anatomy from docs/research/visual-dna.md §4.9; vivid 2×2 from §4.4; glass vehicle card from §4.3. Example strings are invented (ADR-0015 rule 3).
  references: [docs/adr/0009-materials-in-layers.md, docs/adr/0015-references-inspiration-only.md]
