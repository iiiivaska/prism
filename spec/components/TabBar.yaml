name: TabBar
layer: composite
specVersion: 1
status: draft
summary: >-
  The phone's primary navigation: a floating capsule of round buttons that clears the bottom safe
  area, with one inverse-solid disc for the section the reader is in and bare glyphs for its siblings.
  Content scrolls under it. Its items are IconButtons, so the active disc is their inverse-solid rule
  and not a second implementation of it; on Apple the capsule itself is the system tab bar, which
  Prism configures and does not paint (ADR-0009 decision 1).
since: 0.1.0

platforms:
  ios: adapted
  ipados: adapted
  macos: none
  watchos: none
  web-touch: full
  web-desktop: adapted
density: [compact, regular, comfortable]
modality: [pointer, touch]
schemes: [light, dark]

anatomy:
  - part: root
    description: the floating capsule; on Apple this part is the system tab bar and Prism paints none of its cells
  - part: items
    slot: true
    description: one IconButton per destination, exactly one of them selected
  - part: edge
    optional: true
    description: the 1 px inner edge of the capsule, drawn only where the capsule renders the chip recipe

props:
  - name: items
    type: data
    required: true
    description: "[{ value, glyph, label, badge? }]; two to five destinations, each rendered as one IconButton whose `label` is required"
  - name: value
    type: string
    required: true
    description: the `value` of the destination the reader is in; a TabBar is never empty and never has two selected items
  - name: size
    type: enum
    values: [md, lg]
    default: lg
    description: forwarded to every item IconButton; lg is the touch circle, md the pointer one
  - name: onChange
    type: action
    required: true

states: [default]

tokens:
  root:
    background: material.glass.chip
    blur: material.glass.chip.blur
    saturate: material.glass.chip.saturate
    fallbackBackground: color.bg.surface.raised
    fallbackUnderlay: color.bg.page
    radius: radius.control
    padding: space.4
    insetX: space.5
    insetBottom: space.7
    shadow: elevation.2
    z: z.raised
  items:
    gap: space.1
  edge:
    color: color.edge.highlight
    startAlpha: material.glass.chip.edge.start
    endAlpha: material.glass.chip.edge.end

behavior:
  - The bar carries two to five destinations and exactly one is selected; choosing another fires `onChange` once on release inside the item and never on press-down.
  - "Every destination is one IconButton. TabBar forwards `glyph`, `label`, `badge` and its own `size`, sets `isSelected` on the destination named by `value` and leaves `variant` at plain, so the solid active disc and the bare sibling glyphs are IconButton's inverse-solid rule (visual-dna §1 principle 9 and §4.7) rather than a second copy of it. TabBar adds no part inside the button and overrides none of its cells."
  - "Prism's bar is icon-only: the name of a destination is the IconButton's required `label`, which reaches VoiceOver and, on Apple, is also the word the system bar prints under its glyph. A destination whose glyph alone would not say what it is belongs in a screen, not in the bar."
  - "The bar floats. It sits space.5 from the leading and trailing edges and space.7 above the bottom safe-area inset the platform reports - never above the physical edge - so it clears the home indicator, the watch-free browser chrome and the keyboard accessory (visual-dna §4.16)."
  - Content scrolls under the bar rather than ending above it, so the last row of a list is reachable only when the scroll view adds the bar's height plus its inset as bottom content inset.
  - "The capsule is the whole material.glass.chip recipe: its fill, material.glass.chip.blur, material.glass.chip.saturate and the 1 px inner edge in color.edge.highlight from material.glass.chip.edge.start to material.glass.chip.edge.end. The recipe's grain and bloom are 0, so neither is drawn."
  - "The bar is chrome, not content, so the backdrop trigger of ADR-0022 §1.2 does not gate it: a floating bar exists to let the page show through it (ADR-0009 decision 1). The other three triggers do apply - on watchOS, under Reduce Transparency and under Increase Contrast the capsule is drawn opaque, as `fallbackBackground` (color.bg.surface.raised) over `fallbackUnderlay` (color.bg.page), with its radius, padding and elevation.2 unchanged, and with blur, saturation and the inner edge dropped. That choice is made where every material choice is made, inside Prism's Surface module - DSCore's DSSurface on Apple, the React Surface and its stylesheet on the web - which is the only code that reads Prism's contrast and transparency context (ADR-0022 §1.3 and rule 2, ADR-0019 §4 item 6). TabBar reads neither setting and draws whichever of the two cells that module hands it."
  - "The capsule has no height token: it is the item circles' own height (size.control.md or .lg, through the item's `size`) plus twice space.4 of padding, which is about 68 pt around lg circles at the regular density, close to the references' 72 (visual-dna §4.16). The scroll view's bottom content inset is that height plus space.7 plus the bottom safe-area inset."
  - "The bar publishes `raised` to its items in both paths, the chip and its opaque fallback, so an item's tones are the ones tools/contrast checks on color.bg.surface.raised and nothing about an item changes when the glass drops out (ADR-0022 §1.1, §3.1). The bar never publishes a backdrop kind of its own."
  - "Overflow: the bar never scrolls, never wraps and never shrinks its circles. A sixth destination is not added - the least-used ones move behind one of the five, the way a phone moves secondary content to a second screen instead of a longer one (visual-dna §6.5)."
  - A count on a destination is the IconButton's `badge` slot; it never changes the item's hit region and its number is read as part of that button's accessibility value.
  - The bar does not hide, shrink or fade while content scrolls; a control that disappears under the finger is not reachable again without scrolling back.

motion:
  select: motion.spring.snappy
  reduceMotion: crossfade

haptics:
  select: haptic.selection

accessibility:
  role: tab bar (a `tablist` of `tab`s on the web, the system TabView on Apple)
  label: the bar carries the app's own name for its navigation; each destination is named by its IconButton `label`
  traits: [tabBar]
  keyboard: the bar is one Tab stop; Left and Right move focus between destinations and wrap at the ends, Home and End reach the first and last, and Enter or Space activates, so arrowing through the bar does not navigate by itself
  dynamicType: the capsule and its circles do not scale with Dynamic Type - density is their lever (ADR-0024 §7.1) - and no text is drawn inside the bar to grow; on Apple the system bar stacks and grows its own labels
  contrast: "the selected disc is color.text.on-inverse on color.bg.fill.inverse and the bare glyphs are color.icon.secondary, both checked on color.bg.surface.raised, which is what the bar publishes in either path; the capsule's inner edge is decorative"
  reduceTransparency: the capsule loses its blur, saturation and edge and is drawn as color.bg.surface.raised over color.bg.page at the same radius, padding and elevation.2; the items do not change, because the bar already published raised
  reduceMotion: the selection does not slide or scale between destinations; the outgoing disc and the incoming one crossfade by opacity over motion.duration.base with motion.easing.out, and IconButton's own press substitute applies inside the item

usage:
  do:
    - Use a TabBar for two to five top-level destinations on a phone, and nothing else.
    - Give every destination a verb-free noun name ("Routes", "Alerts"); it is the accessibility name and the Apple label.
    - Add the bar's height and inset to the scroll view's bottom content inset, so the last row clears it.
  dont:
    - Don't put an action in the tab bar; a tab changes where you are, a Button changes something.
    - Don't hide or shrink the bar on scroll, and don't let it cover a control.
    - Don't use a TabBar on a pointer layout; AdaptiveShell puts that navigation in a Sidebar or in PillTabs.
    - Don't label a destination only with its glyph in code; the `label` is required because the glyph is not a name.

examples:
  - id: three-destinations
    props: { items: [{ value: "map", glyph: object.map, label: "Live map" }, { value: "alerts", glyph: object.notification, label: "Alerts" }, { value: "reports", glyph: object.chart, label: "Reports" }], value: "map" }
  - id: five-destinations
    props: { items: [{ value: "map", glyph: object.map, label: "Live map" }, { value: "fleet", glyph: object.bus, label: "Fleet" }, { value: "alerts", glyph: object.notification, label: "Alerts" }, { value: "reports", glyph: object.chart, label: "Reports" }, { value: "account", glyph: object.user, label: "Account" }], value: "reports" }
    description: the widest bar Prism draws; a sixth destination moves behind one of these five
  - id: with-badge
    props: { items: [{ value: "map", glyph: object.map, label: "Live map" }, { value: "alerts", glyph: object.notification, label: "Alerts", badge: { count: 3 } }, { value: "reports", glyph: object.chart, label: "Reports" }], value: "map" }
  - id: size-md
    props: { items: [{ value: "map", glyph: object.map, label: "Live map" }, { value: "alerts", glyph: object.notification, label: "Alerts" }], value: "alerts", size: md }
  - id: over-map
    props: { items: [{ value: "map", glyph: object.map, label: "Live map" }, { value: "fleet", glyph: object.bus, label: "Fleet" }, { value: "alerts", glyph: object.notification, label: "Alerts" }], value: "map" }
    surface: map
    description: the map HUD form - the capsule keeps the chip recipe and still publishes raised to its items
  - id: labels-ru
    props: { items: [{ value: "map", glyph: object.map, label: "Карта в реальном времени" }, { value: "alerts", glyph: object.notification, label: "Оповещения" }, { value: "reports", glyph: object.chart, label: "Отчёты" }], value: "alerts" }
    description: Russian names run about half again as long as their English twins; nothing in the bar changes, because the names live in the accessibility label and in Apple's own bar

notes:
  platform:
    ios: "adapted. The capsule is the system tab bar (ADR-0009 decision 1): Prism passes the items, the badges and the selected value to it and paints no background, blur, edge or shadow, and the system prints each item's `label` under its glyph. The floating capsule of this spec is the shape Prism draws only on the web."
    ipados: "adapted. Same as iOS, and only at compact width: in regular width AdaptiveShell replaces the bar with a Sidebar (spec/patterns/README.md)."
    macos: "none. A Mac window navigates through a Sidebar and a TopBar (ADR-0010 Tier 2, AdaptiveShell); a floating bottom bar under a pointer would put the primary navigation furthest from the cursor and cover the content it sits on."
    watchos: "none. ADR-0010's Tier 3 list has no TabBar, no glass and no blur; a watch screen is a vertical stack of at most three glanceable tiles (spec/patterns/README.md)."
    web-desktop: "adapted. The bar is drawn only at compact width, where the shell has folded to the phone layout; a pointer layout navigates with PillTabs in a TopBar or with a Sidebar."
  design: >-
    Both sightings in docs/research/component-inventory.md (2/11, HB and KM) are the same object: a
    floating capsule of round buttons with one inverse-solid active disc and content scrolling under it,
    "the same one solid, the rest hairline rule as PillTabs, with polarity inverted". The geometry is
    docs/research/visual-dna.md §4.16 - 16 from the sides, 24 from the bottom, content scrolling under -
    which space.5 and space.7 carry; the capsule is the toolbar reading of the chip recipe in §7.3. The
    items are IconButtons rather than a private item type, because §4.7's "one solid among hairlines" is
    already that component's rule. Example strings are invented (ADR-0015 rule 3).
  references:
    - docs/adr/0009-materials-in-layers.md
    - docs/adr/0010-platform-tiers-density-modality.md
    - docs/adr/0011-accessibility-tiers-ci.md
    - docs/adr/0012-layers-and-v1-scope.md
    - docs/adr/0013-icon-registry.md
    - docs/adr/0015-references-inspiration-only.md
    - docs/adr/0022-materials-and-fallbacks.md
    - docs/adr/0023-motion-tokens.md
    - docs/adr/0029-direction-board-sign-off.md
