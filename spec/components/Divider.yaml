name: Divider
layer: primitive
specVersion: 2
status: draft
summary: >-
  One hairline that separates rows inside a single container: table and list rows, the rule under a
  tab rail, the edge between two columns of one panel. It draws `border.hairline` in
  `color.border.hairline` and nothing else. Everywhere else in Prism the luminance ladder and the
  spacing scale do the separating, so a Divider is the exception, not the default.
since: 0.1.0

platforms:
  ios: full
  ipados: full
  macos: full
  watchos: none
  web-touch: full
  web-desktop: full
density: [compact, regular, comfortable]
modality: [pointer, touch]
schemes: [light, dark]

anatomy:
  - part: root
    description: the 1 px line; the component draws no fill, no shadow and no second line

props:
  - name: orientation
    type: enum
    values: [horizontal, vertical]
    default: horizontal
  - name: inset
    type: enum
    values: [none, content]
    default: none
    description: "`content` pulls both ends in by the card padding, so the line starts where the content starts"
  - name: isDecorative
    type: boolean
    default: true
    description: >-
      true hides the line from assistive technology, which is what a hairline is for; set it false only where
      the line is the sole grouping cue. The name and the polarity are the ones Icon and Avatar carry - one
      meaning, one name, one polarity - and only the default differs, because a Divider genuinely carries
      nothing while a glyph and a portrait genuinely can (spec/SCHEMA.md, "One meaning, one name, one polarity")

states: [default]

tokens:
  root:
    color:
      page: color.border.hairline
      solid: color.border.hairline
      raised: color.border.hairline
      nested: color.border.hairline
      vivid: color.border.on-media
      glass: color.border.on-glass-fill
      glassLight: color.border.on-glass-fill
    thickness: border.hairline
    inset:
      content: space.card-padding

behavior:
  - The Divider is one line of `border.hairline` (1 px) in `color.border.hairline`; it never draws a fill, a shadow, a second line or a gap of its own.
  - "`orientation: horizontal` stretches to the width of a parent that stacks its children in a column (a block, a vertical stack, a column flex box, a grid), and `vertical` to the height of a parent that stacks them in a row. A Divider has no length of its own, in either orientation: its length is its parent's cross size, and it never decides that size. A parent whose cross size is definite (set by its own container, or taken whole from what it is offered) gives the Divider that length. A parent that sizes to its content (on the web an inline block or an inline flex column around a horizontal Divider, a flex row with no height of its own around a vertical one; in SwiftUI a stack under `fixedSize` on the Divider's cross axis, notes.platform.ios) is as long as its other children, and the Divider runs that length and adds nothing to it but its two insets, so alone in such a parent it has no length and paints nothing. It is never placed along its own axis, where the stacks disagree about the length it gets: a horizontal Divider is not a sibling in a row, a vertical one is not a sibling in a column, and a \"rule, label, rule\" heading is not a Divider."
  - "`inset: content` trims both ends by `space.card-padding`, so a rule inside a card starts at the content edge; `none` runs the full bleed of the container."
  - The Divider owns no margin. The distance to the rows above and below comes from the layout's own spacing tokens, so one list can change density without touching the rule.
  - On a surface that publishes `vivid` the line takes `color.border.on-media` (white 40 %) and on the scheme's glass `color.border.on-glass-fill`, because a hairline of `color.border.hairline` disappears on both.
  - A hairline is never drawn over a vivid surface's bloom or over the lightest stop of its gradient; on a vivid tile the anatomy separates by position, not by a rule.
  - "A Divider is not drawn on a surface that publishes `inverse` or `accent`: those materials carry the one solid control or the one lit tile (Surface.yaml), never a table or a list of rows, and Prism has no hairline role that survives them. The colour matrix names every other material and has no `default`, so on those two the colour is not set (spec/SCHEMA.md, \"The binding-matrix grammar\"): a Divider placed there anyway keeps its 1 px box, paints nothing, and its accessibility does not change."
  - Increase Contrast strengthens the line through the token alone (`color.border.hairline` steps to ink 30 % in light and white 25 % in dark); the component has no contrast branch.
  - Under the glass fallback the enclosing Surface publishes `raised`, so the Divider takes the `raised` cell, `color.border.hairline`; it needs no fallback of its own.
  - "`isDecorative` is the one accessibility flag Prism gives this meaning, under one name and one polarity on Icon, Avatar and Divider alike: true hides the part from assistive technology. It defaults true here and false there, because that is the one thing the three components really differ about (spec/SCHEMA.md)."

accessibility:
  role: none while `isDecorative` is true (the default); separator otherwise, where the platform has that role — the web; Apple has none (notes.platform.ios)
  label: none; a Divider carries no text and never replaces a group heading
  keyboard: not focusable, and not a stop for rotor or landmark navigation
  dynamicType: the line does not scale; `space.card-padding` does not scale either, so an inset rule keeps its alignment at every text size
  contrast: "the hairline is decoration and carries no meaning, so it is outside ADR-0011's boundary tier; a line that must be seen is not a Divider but a control edge, which uses `color.border.boundary` (3.80:1 on white, a checked boundary pair)"
  reduceTransparency: not applicable — the Divider renders no glass; when the enclosing Surface falls back from glass to `raised`, the line takes the `raised` cell with it
  reduceMotion: not applicable — the Divider never animates, so there is nothing to substitute

usage:
  do:
    - "Use a hairline only where the references used one: table rows, list rows, input edges and the rule under a tab rail."
    - Give every Divider in one list the same `inset`, so the rules line up like the other repeated affordances on a screen.
    - "Prefer the `content` inset inside a card, so the rule respects `space.card-padding` instead of cutting the card in half."
  dont:
    - Don't separate cards, groups or sections with a Divider; `space.group-gap` and `space.section-gap` do that, and depth is a luminance ladder, not lines.
    - Don't pair a Divider with a border or a shadow to show nesting; use the next step of the surface ladder.
    - Don't draw a Divider across a vivid bloom or a gradient's lightest stop, and don't let one carry meaning a sighted user alone can read.
    - Don't stack two Dividers or use one as a spacer with `space.0`; an empty rule is still a line.

examples:
  - id: horizontal
    props: { orientation: horizontal, inset: none }
  - id: horizontal-inset
    props: { orientation: horizontal, inset: content }
    surface: solid
    description: a row rule inside a card, starting at the content edge
  - id: vertical
    props: { orientation: vertical, inset: none }
    surface: solid
    description: the edge between two columns of one panel
  - id: semantic
    props: { orientation: horizontal, isDecorative: false }
    description: "the one case where the rule is the grouping cue: exposed as a separator on the web; Apple has no separator role (notes.platform.ios)"
  - id: on-vivid
    props: { orientation: horizontal, inset: content }
    surface: vivid
    description: on vivid the line is `color.border.on-media`, kept out of the bloom
  - id: on-glass-over-map
    props: { orientation: horizontal, inset: content }
    surface: glass
    backdrop: map

notes:
  platform:
    ios: "`isDecorative: false` has no Apple counterpart: SwiftUI's accessibility traits carry no separator, and a Divider speaks no word of its own (ADR-0032 rules 1 and 5), so on iOS, iPadOS and macOS the line is never an accessibility element, whatever `isDecorative` says. Where a rule is the only grouping cue, a container or a heading carries the grouping for VoiceOver; the web exposes the same line as `role=\"separator\"`. Behavior 2's parent that sizes to its content is, in SwiftUI, a stack under `fixedSize` on the Divider's cross axis: `.fixedSize(horizontal: true, vertical: false)` around a horizontal Divider's `VStack`, `.fixedSize(horizontal: false, vertical: true)` around a vertical one's `HStack`. The Divider's ideal length is zero, so there it is as long as the longest other child, as in the web's shrink-to-fit box and flex row. A stack left to size itself is not such a parent: the Divider is flexible along its length, so the stack takes all the length it is offered, and the Divider runs that."
    watchos: "`none`. ADR-0010's Tier 3 list does not name Divider, and a watch screen is a vertical stack of at most three glanceable tiles (visual-dna §6.3), where spacing and the luminance ladder separate. A white-8 % hairline there would be structure for sighted users only (visual-dna §7.5). This is a decision, not a gap: the watch uses the gap tokens instead."
    macos: identical to iOS; a Divider has no hover state, because it is not interactive.
  design: "The hairline roles and where they are allowed come from docs/research/visual-dna.md §1 principle 1 (depth is a luminance ladder; borders are reserved for inputs and tables) and §7.5 (inputs, table rows and chip strokes use `color.border.hairline`; `color.border.strong` is for outline pills, `color.border.boundary` for control edges that must be seen). The `vivid` and `glass` cells follow §4.7 (rings on media go to white 40 %) and ADR-0030 §3.2. The count is docs/research/component-inventory.md, where Divider appears in 3 of 11 shots, all desktop, as table row hairlines and column separators. specVersion 2 settles behavior 2 for a parent that sizes to its content, after both stacks implemented version 1: a vertical Divider takes the height of a row that stacks its children, as a horizontal one takes the width of a column, and neither decides its parent's cross size - in a content-sized parent it runs the length of the longest other child and adds nothing but its insets, which on Apple is an ideal length of zero (notes.platform.ios). Version 1 said only that a vertical Divider needs a parent with a definite cross size, and there Apple's line claimed SwiftUI's default ideal length of 10 pt."
  references: [docs/adr/0010-platform-tiers-density-modality.md, docs/adr/0011-accessibility-tiers-ci.md, docs/adr/0024-token-source-conventions.md, docs/adr/0029-direction-board-sign-off.md, docs/adr/0030-semantic-roles-from-the-direction-board.md]
