name: Chip
layer: primitive
specVersion: 1
status: draft
summary: >-
  A small interactive pill carrying one short label and, optionally, a leading glyph or Avatar, a trailing
  glyph or a remove control. It filters, names a selection or identifies an entity. Selection is told by a
  full-strength stroke and label, never by a solid fill: the one solid in a group belongs to the primary
  action. A static count or status mark is a Badge, not a Chip.
since: 0.1.0

platforms:
  ios: full
  ipados: full
  macos: full
  watchos: none
  web-touch: full
  web-desktop: full
density: [compact, regular, comfortable]
modality: [pointer, touch]
schemes: [light, dark]

anatomy:
  - part: root
    description: the pill, which is the Surface module's glass chip over media (ADR-0036); a filter or action chip's control covers it
  - part: label
  - part: leadingIcon
    optional: true
    description: a glyph at the small icon size; status.check replaces it, or the Avatar that stands in its place, while a chip is selected over media or on an inverse surface
  - part: avatar
    optional: true
    slot: true
    description: an Avatar in the leading position, on the md chip only, drawn at size sm and decorative; it stands in place of leadingIcon
  - part: trailingIcon
    optional: true
    description: nav.close while `isRemovable`, which is then the remove control; otherwise the caller's `trailingIcon`, such as action.copy on an identifier chip whose press copies it

props:
  - name: label
    type: string
    required: true
  - name: size
    type: enum
    values: [sm, md]
    default: sm
  - name: leadingIcon
    type: icon
  - name: avatar
    type: slot
    description: >-
      an Avatar in the leading position, which it takes in place of `leadingIcon`: its own props, which the chip draws
      at size sm and decorative, because the chip's `label` names it. Only the md chip draws it
  - name: trailingIcon
    type: icon
    description: >-
      a glyph after the label, inside the chip's one control, that shows what the press does (action.copy on an
      identifier chip); `isRemovable` takes the trailing position, so a trailingIcon given with it is not drawn
  - name: isSelected
    type: boolean
    description: >-
      set on a filter chip only, true or false: a chip that carries it is a toggle the user turns on and off, and
      true puts it in the `selected` state. Unset, the default, the chip is not a filter and cannot be selected
  - name: isRemovable
    type: boolean
    default: false
  - name: isDisabled
    type: boolean
    default: false
  - name: onPress
    type: action
  - name: onRemove
    type: action

states: [default, hover, pressed, selected, focus-visible, disabled]

tokens:
  root:
    background:
      page:
        default: comp.chip.bg.rest
        map: material.glass.chip
        image: material.glass.chip
        vivid: material.glass.chip
      solid: comp.chip.bg.rest
      raised: comp.chip.bg.rest
      nested: comp.chip.bg.rest
      glassLight: comp.chip.bg.rest
      vivid: material.glass.chip
      glass: material.glass.chip
    blur:
      page:
        map: material.glass.chip.blur
        image: material.glass.chip.blur
        vivid: material.glass.chip.blur
      vivid: material.glass.chip.blur
    saturate:
      page:
        map: material.glass.chip.saturate
        image: material.glass.chip.saturate
        vivid: material.glass.chip.saturate
      vivid: material.glass.chip.saturate
    fallbackBackground: color.bg.surface.raised
    fallbackUnderlay: color.bg.page
    edgeColor: color.edge.highlight
    edgeStartAlpha:
      page:
        map: material.glass.chip.edge.start
        image: material.glass.chip.edge.start
        vivid: material.glass.chip.edge.start
      vivid: material.glass.chip.edge.start
      glass: material.glass.chip.edge.start
    edgeEndAlpha:
      page:
        map: material.glass.chip.edge.end
        image: material.glass.chip.edge.end
        vivid: material.glass.chip.edge.end
      vivid: material.glass.chip.edge.end
      glass: material.glass.chip.edge.end
    border:
      default: comp.chip.border.rest
      page:
        default: comp.chip.border.rest
        map: color.border.on-glass-fill
        image: color.border.on-glass-fill
        vivid: color.border.on-media
      vivid: color.border.on-media
      glass: color.border.on-glass-fill
      inverse: color.text.on-inverse
    borderWidth: border.hairline
    radius: radius.chip
    height:
      sm: size.control.sm
      md: size.control.md
    paddingX:
      sm: space.4
      md: space.5
    gap: space.2
    hover:
      overlay: color.bg.fill.neutral.subtle
    pressed:
      overlay: comp.chip.bg.pressed
    selected:
      border:
        default: comp.chip.border.selected
        page:
          default: comp.chip.border.selected
          map: color.border.on-glass-fill
          image: color.border.on-glass-fill
          vivid: color.border.on-media
        vivid: color.border.on-media
        glass: color.border.on-glass-fill
        inverse: color.text.on-inverse
      borderWidth: border.strong
    focus-visible:
      ring: color.border.focus
      ringWidth: border.focus
    disabled:
      opacity: opacity.disabled
  label:
    typography:
      sm: type.label.sm
      md: type.label.md
    color:
      default: color.text.secondary
      page:
        default: color.text.secondary
        map: color.text.on-glass-fill
        image: color.text.on-glass-fill
        vivid: color.text.on-glass-fill
      vivid: color.text.on-glass-fill
      glass: color.text.on-glass-fill
      accent: color.text.on-accent-secondary
      inverse: color.text.on-inverse
    selected:
      color:
        default: color.text.primary
        page:
          default: color.text.primary
          map: color.text.on-glass-fill
          image: color.text.on-glass-fill
          vivid: color.text.on-glass-fill
        vivid: color.text.on-glass-fill
        glass: color.text.on-glass-fill
        accent: color.text.on-accent
        inverse: color.text.on-inverse
  leadingIcon:
    size: size.icon.sm
    color:
      default: color.icon.secondary
      page:
        default: color.icon.secondary
        map: color.text.on-glass-fill
        image: color.text.on-glass-fill
        vivid: color.text.on-glass-fill
      vivid: color.text.on-glass-fill
      glass: color.text.on-glass-fill
      accent: color.text.on-accent-secondary
      inverse: color.text.on-inverse
    selected:
      color:
        default: color.icon.primary
        page:
          default: color.icon.primary
          map: color.text.on-glass-fill
          image: color.text.on-glass-fill
          vivid: color.text.on-glass-fill
        vivid: color.text.on-glass-fill
        glass: color.text.on-glass-fill
        accent: color.text.on-accent
        inverse: color.text.on-inverse
  trailingIcon:
    size: size.icon.sm
    color:
      default: color.icon.secondary
      page:
        default: color.icon.secondary
        map: color.text.on-glass-fill
        image: color.text.on-glass-fill
        vivid: color.text.on-glass-fill
      vivid: color.text.on-glass-fill
      glass: color.text.on-glass-fill
      accent: color.text.on-accent-secondary
      inverse: color.text.on-inverse

behavior:
  - "The role follows from the props alone, the same on every platform. A chip that sets `isSelected`, true or false, is a filter: a toggle whose press asks the app to turn it on or off, and whose `isSelected` is its state. A chip that leaves `isSelected` unset and has `onPress` or `isRemovable` is a button. A chip with none of the three is a static label and exposes no role; a static count or status mark is a Badge."
  - "A filter or button chip is a control: it is focusable, takes the pressed state and obeys the hit rule, and its press fires `onPress` once on release inside the hit region. A filter chip changes its look only when the app sets `isSelected`: the press asks, and the app decides."
  - The hit region is the larger of the visual size and size.hit on each axis, so the sm chip stays 32 pt tall while its target is 44 pt under touch and 28 pt under pointer.
  - "`isSelected` thickens the stroke to border.strong in comp.chip.border.selected and lifts the label to color.text.primary; the fill does not change, because the one solid element in a group is the primary control."
  - "Selection is never carried by color alone: the stroke, the label tone and the accessibility state change together."
  - "Over media that ladder collapses, because every tone on a glass chip is color.text.on-glass-fill and every stroke is color.border.on-glass-fill or color.border.on-media: the 1 px step from border.hairline to border.strong would be the only cue. So over a map, imagery, a vivid surface or the scheme's glass a selected chip also renders status.check in the leading position, replacing the leading glyph or the Avatar it had, and the stroke still thickens. An inverse surface collapses the ladder the same way, into color.text.on-inverse alone, so a selected chip there renders status.check too. The check follows the context the chip publishes, so under its fallback, which publishes raised, the chip draws none."
  - Over a map, imagery, a vivid surface or the scheme's glass the chip renders the glass chip and carries color.text.on-glass-fill for its label and glyphs, because a chip is checked with its primary foreground only.
  - "The chip is the whole material.glass.chip recipe: its fill, material.glass.chip.blur, material.glass.chip.saturate and the 1 px inner edge in color.edge.highlight from material.glass.chip.edge.start to material.glass.chip.edge.end. The recipe's grain and bloom are 0, so neither is drawn, and the edge exists only where the chip renders glass. On the scheme's glass the chip draws the fill and the edge and no blur or saturation, so no chip blurs glass a second time (ADR-0036 §5)."
  - "On an accent or an inverse surface the chip has no fill of its own: `root.background` has no cell for either material and no `default`, so it is not set there (spec/SCHEMA.md, \"The binding-matrix grammar\"). On accent it sits on color.bg.fill.accent with color.text.on-accent-secondary for its label and glyphs and color.text.on-accent when selected, which are the pairs checked on that material. On inverse it sits on color.bg.fill.inverse, and its label, its glyphs and its stroke take color.text.on-inverse, the material's one foreground, because no border role is keyed to inverse and comp.chip.border.rest would vanish there. A selected glass Surface renders inverse under the glass fallback (Surface.yaml), so a chip inside one reaches these cells without asking for them."
  - "The hover overlay and the pressed fill are layers painted over whatever the chip renders, in every material: comp.chip.bg.pressed has no material axis, so a pressed glass chip keeps its glass under the pressed fill. Neither ever becomes the cell the chip hands the Surface module's chip shape, so no press or hover switches the pill between the recipe and its own fill (ADR-0037 §5)."
  - The label never wraps and never truncates; a chip that cannot show its label is too long for a chip and belongs in a ListRow.
  - "`trailingIcon` is a glyph inside the chip's one control, hidden like every glyph of the chip: it shows what the press does, as action.copy shows that an identifier chip's press copies it, and `onPress` is that action. `isRemovable` takes the trailing position, so a `trailingIcon` given with it is not drawn."
  - "`isRemovable` renders nav.close in the trailing position; that glyph is its own control with its own hit region, the larger of the glyph's box and size.hit on each axis, and its own name, and pressing it fires `onRemove` without firing `onPress`. Its focus ring is color.border.focus at border.focus width outside the glyph's box, drawn as a circle."
  - "That name is the `strings.Chip.remove` template, \"Remove {label}\" in Prism's English defaults, filled with the chip's own `label`; Chip invents no word of its own and the app replaces the template once at the root (ADR-0032 rules 1 and 2). The web sets the name explicitly, so React Aria's own remove string never supplies it and the two stacks say one word (ADR-0032 rule 7)."
  - "An identifier chip may put an Avatar in the leading position through `avatar`, and only on the md chip: the sm chip and the sm avatar are both size.control.sm, so the circle would run edge to edge. The md chip leaves it half of size.control.md less size.control.sm above and below, 2 to 4 pt by density, and the same inset before it, in place of root.paddingX, so the circle is concentric with the pill's leading end; the label follows at root.gap. An `avatar` given to the sm chip is not drawn."
  - "The Avatar is drawn at size sm and decorative, because the chip's `label` names the chip and the Avatar's name would be read twice. It reads the context the chip publishes, like every part, and takes Avatar.yaml's own cells there: where the chip renders glass the Avatar asks for glass too and draws it flat, the recipe's fill and edge with no blur, because a chip inside another chip samples nothing (ADR-0037); where the chip renders its own cell the Avatar takes its own cell; and under the chip's fallback it reads raised and takes its own cell. In light that own cell is color.bg.surface.raised on the chip's own fill, the same raised step, so the disc does not show and the initials carry the Avatar, as they nearly do alone on the page, where the disc is about 1.05:1 on color.bg.page; a visible disc would be a change to Avatar, not to Chip. No press or hover of the chip changes what the Avatar renders."
  - A chip group leaves space.3 between chips, and chips wrap onto a second line rather than scrolling out of reach.
  - Hover (pointer only) adds the neutral overlay; pressing takes comp.chip.bg.pressed and scales the pill to 0.97 under motion.spring.snappy.
  - "Selection moves the stroke's width and colour and the tones of the label and the leading glyph on motion.spring.smooth, the `select` cell of the motion block; nothing scales, and the check appears and leaves with the selection, with no fade or growth of its own."
  - Chips that select one option out of a set are a SegmentedControl instead; chips are for multi-select filters, identifiers and removable selections.

motion:
  press: motion.spring.snappy
  select: motion.spring.smooth
  reduceMotion: crossfade

haptics:
  press: haptic.impact.light

accessibility:
  role: "button; a filter chip, one that sets `isSelected`, is a toggle button whose `isSelected` is its pressed state (the selected trait on Apple, `aria-pressed` on the web); a chip with neither `onPress`, `isRemovable` nor `isSelected` is a static label with no role. The remove control is a button of its own"
  label: the visible label, and nothing else; the glyphs, the check and the Avatar are hidden, so a chip whose glyph carries meaning the label does not already carry names it in the label. The remove control is named by the `strings.Chip.remove` template, "Remove Last 24 hours" under the English defaults (ADR-0032 rules 1 and 2)
  traits: [button, selected]
  keyboard: Space and Enter toggle or activate; Delete and Backspace remove a removable chip; Tab reaches the chip and then its remove control; the focus ring is color.border.focus at border.focus width outside the pill, and outside the remove control's glyph when that control has focus
  dynamicType: the label scales with type.label.*; the chip grows with it, and a row of chips wraps to more lines instead of truncating
  contrast: the rest label is color.text.secondary and the selected label color.text.primary, both functional on color.bg.page, color.bg.surface and color.bg.surface.raised; over media both are color.text.on-glass-fill on material.glass.chip, on an accent surface they are color.text.on-accent-secondary and color.text.on-accent on color.bg.fill.accent, and on an inverse surface both are color.text.on-inverse on color.bg.fill.inverse; the rest stroke is comp.chip.border.rest and is decorative, because the fill step and the label already identify the chip; the selected stroke is comp.chip.border.selected, which holds the 3:1 boundary tier on the three solid grounds, and over media and on inverse the status.check glyph carries selection instead of the stroke
  reduceTransparency: under Reduce Transparency and Increase Contrast, Prism's Surface module draws the pill as color.bg.surface.raised over color.bg.page at the same radius; blur, saturation and the inner edge are dropped; the pill publishes raised, so every part takes its default cell, the stroke returns to its hairline in comp.chip.border.rest and every tone to the solid family; and the chip drops the status.check glyph, which it shows only on a media ground or on inverse, because the stroke and label ladder carries selection again. An Avatar in the leading position reads raised too and takes its own cell
  reduceMotion: the press scale is replaced by the pressed fill, comp.chip.bg.pressed, over motion.duration.base with motion.easing.out, and selection crossfades the stroke and the tones of the label and the leading glyph over motion.duration.base with motion.easing.out in place of motion.spring.smooth; the check appears and leaves at once, as it does in standard motion, and nothing scales
  voiceOver: announces the label, then "selected" when it is, then its role; a removable chip announces its remove control as a separate element

usage:
  do:
    - Use chips for filters the user can combine, for removable selections and for identifiers.
    - Keep labels to one or two words; put the unit or the qualifier in the label, not in a second line.
    - Group chips on one line and let them wrap; leave space.3 between them.
    - Set `isSelected` on every filter chip, false included, and on no other chip.
  dont:
    - Don't fill a selected chip with a solid or the accent; the stroke and the label carry selection.
    - Don't use a Chip for a count or a status word; that is Badge and StatusPill.
    - Don't use chips for one exclusive choice; that is SegmentedControl.
    - Don't put a chip below 12 px of label text or shrink it below its 44 pt touch target.

examples:
  - id: default-sm
    props: { label: "Last 24 hours", size: sm }
  - id: selected
    props: { label: "Last 24 hours", isSelected: true }
    description: a filter chip that is on
  - id: with-leading-icon
    props: { label: "Routes", leadingIcon: action.filter }
  - id: removable
    props: { label: "North yard", isRemovable: true }
  - id: identifier-copy
    props: { label: "B-4417", trailingIcon: action.copy }
    description: an identifier chip whose press copies it; action.copy shows what the press does, and the name is the identifier itself
  - id: md-size
    props: { label: "Depots", size: md, leadingIcon: object.map-pin }
  - id: disabled
    props: { label: "Last 24 hours", isDisabled: true }
  - id: md-with-avatar
    props: { label: "Anna Petrova", size: md, avatar: { name: "Anna Petrova" } }
    description: an identifier chip whose leading position holds an Avatar, drawn at size sm and decorative; only the md chip leaves it room, concentric with the pill's leading end
  - id: on-map
    props: { label: "Depots", leadingIcon: object.map-pin }
    surface: map
    description: over a map the chip renders the glass chip recipe and carries the primary glass foreground only
  - id: selected-on-map
    props: { label: "Depots", isSelected: true }
    surface: map
    description: over media selection adds status.check in the leading slot, because every tone on the chip is one glass foreground
  - id: on-vivid
    props: { label: "Yield" }
    surface: vivid
  - id: on-glass-over-image
    props: { label: "In service" }
    surface: glass
    backdrop: image
  - id: russian-label
    props: { label: "Последние 24 часа", isSelected: true }
    description: Russian labels widen the chip instead of truncating

notes:
  platform:
    ios: "On iOS, iPadOS and macOS the chip is a SwiftUI `Button` whose label is the pill; a filter chip carries the selected trait while `isSelected` is true. The remove control is a second `Button` laid over the trailing glyph, its own element named by `strings.Chip.remove`. `avatar` takes a `DSAvatar`, which the chip draws at size sm and decorative whatever size it was given."
    watchos: "`none`. Chip is not in ADR-0010's Tier 3 set; a 32 pt pill inside a 44 pt target does not fit a wrist screen of at most three glanceable tiles, and a watch filter is a list screen."
    macos: default size follows compact density (28 pt for sm); hover state required; the remove control's glyph is drawn at rest, as on every platform, because the control is its own element and focus stop and is never invisible where it can be pressed; Delete and Backspace remove the chip from the keyboard.
    web-desktop: "The pill is a `span` that carries the Surface module's chip shape and the press scale; inside it a filter chip is React Aria's `ToggleButton` (`aria-pressed` is `isSelected`) and a button chip React Aria's `Button`, each covering the pill, and the remove control is a second `Button` beside it, not inside it. React Aria's `Tag` is not used: a Tag lives only inside a TagGroup's grid, and its remove button brings a localized string of its own. `avatar` takes Avatar's `name`, `image` and `hasRing`; the chip draws it at size sm and decorative."
  design: >-
    Eight of eleven shots carry a chip (docs/research/component-inventory.md): count tiles, identifiers
    with a copy glyph, period filters whose selected state is a full-strength stroke and label, metric
    chips on a glass-look fill and a filter chip with a leading icon over a map. The pill and the 32 pt
    visual with a 44 pt hit area are docs/research/visual-dna.md §1 principle 2 and §6.7; the hairline
    stroke on a filled chip is §7.5, and it stays decorative because the fill step and the label identify
    the chip (ADR-0030 §3.2 keeps color.border.boundary for a control identified only by its edge). "No
    second solid in a group" is principle 9 and anti-pattern 24. The status.check on a selected chip over
    media is not in the references; it is what ADR-0011's "never color alone" leaves once ADR-0029 §1.2
    collapses every tone on a glass chip to one foreground, which turns the stroke and label ladder of
    the period-filter sighting into a 0.5 px width step. Example strings are invented (ADR-0015 rule 3).
    The six contract defects were settled before either stack was written (roadmap P4-8): the Avatar in
    the leading position is the typed `avatar` slot, as ADR-0034 types a Badge slot; the role follows
    from `isSelected` being set, the attribute idiom of ARIA's own state properties, where absent means the
    state does not apply; `isRemovable` wins the trailing position and `onPress` is the action a trailing
    glyph shows; the motion block's `select` is the selection motion `accessibility.reduceMotion` names; the chip has
    no fill on accent and inverse, and on inverse every part takes color.text.on-inverse, as Avatar's
    parts do. The pill over media is the Surface module's glass chip (ADR-0036), and a chip inside it,
    the Avatar, samples nothing (ADR-0037).
  references: [docs/adr/0010-platform-tiers-density-modality.md, docs/adr/0011-accessibility-tiers-ci.md, docs/adr/0013-icon-registry.md, docs/adr/0022-materials-and-fallbacks.md, docs/adr/0029-direction-board-sign-off.md, docs/adr/0030-semantic-roles-from-the-direction-board.md, docs/adr/0032-component-owned-strings.md, docs/adr/0034-badge-slots-hold-a-badge.md, docs/adr/0036-glass-chip-and-backdrop.md, docs/adr/0037-chip-inside-a-chip.md]
