name: Slider
layer: primitive
specVersion: 1
status: draft
summary: >-
  A continuous or stepped value set by dragging. A thin pill track carries an ink fill from the minimum
  to the value and a circular thumb at the value; the fill and the thumb are the same solid, told apart
  by size rather than by color, and the unfilled part is a lighter step of the same ramp. The readout
  beside the label is a tabular metric, because the number is what the control is for.
since: 0.1.0

platforms:
  ios: full
  ipados: full
  macos: full
  watchos: none
  web-touch: full
  web-desktop: full
density: [compact, regular, comfortable]
modality: [pointer, touch]
schemes: [light, dark]

anatomy:
  - part: root
    description: the label row above and the track row below; focus lands on the thumb, not here
  - part: track
  - part: fill
    description: the part of the track between the minimum and the value
  - part: thumb
  - part: ticks
    optional: true
    description: one mark per step, drawn under the track; decorative
  - part: label
    optional: true
  - part: valueLabel
    optional: true
    description: the current value with its unit, and the readout that follows the thumb while dragging

props:
  - name: value
    type: number
    required: true
  - name: min
    type: number
    default: 0
  - name: max
    type: number
    default: 100
  - name: step
    type: number
    description: when set, the value snaps to multiples of it from `min`
  - name: showsTicks
    type: boolean
    default: false
    description: draws one mark per step; without a `step` it draws nothing
  - name: label
    type: string
  - name: unit
    type: string
    description: hung beside the readout by Text, never inside the numeral
  - name: showsValue
    type: boolean
    default: true
  - name: isDisabled
    type: boolean
    default: false
  - name: onChange
    type: action
    required: true
  - name: onChangeEnd
    type: action

states: [default, hover, focus-visible, disabled, dragging]

tokens:
  root:
    gap: space.3
    disabled:
      opacity: opacity.disabled
  track:
    background:
      default: comp.slider.track.bg
      vivid: color.border.on-media
      glass: color.border.on-glass-fill
    height: comp.slider.track.height
    radius: radius.control
  fill:
    background:
      default: comp.slider.fill
      vivid: color.bg.fill.inverse-media
      glass: color.bg.fill.inverse-media
    radius: radius.control
  thumb:
    background:
      default: comp.slider.thumb.fill
      vivid: color.bg.fill.inverse-media
      glass: color.bg.fill.inverse-media
    size: comp.slider.thumb.size
    radius: radius.control
    hover:
      halo: color.bg.fill.neutral.subtle
      haloSpread: space.3
    dragging:
      halo: color.bg.fill.neutral.subtle
      haloSpread: space.3
    focus-visible:
      ring: color.border.focus
      ringWidth: border.focus
  ticks:
    color:
      default: comp.slider.tick
      vivid: color.border.on-media
      glass: color.border.on-glass-fill
    width: border.hairline
  label:
    typography: type.label.md
  valueLabel:
    typography: type.metric.md

behavior:
  - Dragging the thumb moves the value and fires `onChange` continuously; `onChangeEnd` fires once on release. A tap or click anywhere on the track moves the thumb to that point and fires both.
  - The track is a pill of comp.slider.track.height at radius.control, drawn across the full width in comp.slider.track.bg; the fill is the same pill from `min` to `value` in comp.slider.fill. The filled part is the one solid in the control and the unfilled part is a lighter step of the same ramp (visual-dna §1 principle 9; dataviz-design §3, the meter of the form heuristic).
  - The thumb is a circle of comp.slider.thumb.size at radius.control, centred on the value. It is the same ink as the fill and is told apart by its size, never by a second color or a shadow (visual-dna §1 principle 1).
  - The thumb's hit region is the larger of its circle and size.hit on each axis (28 pt under pointer, 44 pt under touch); modality owns that region and never changes the drawn circle, which follows density through comp.slider.thumb.size (ADR-0024 §7.1 and §7.3).
  - "The thumb is the focusable element, not the row: it takes the control's single tab stop, and the focus ring is drawn around its circle at radius.control, outside it, in color.border.focus at border.focus width. The label and the readout are never focusable."
  - "`step` snaps the value to multiples of it from `min`, and the reported value is always clamped to the closed range: a `value` outside `min`..`max` renders and reports as the nearer end, `max` is reachable even when `max - min` is not a whole number of steps (the last stop is short), and a `step` of zero or less is read as no step at all."
  - "`showsTicks` draws one mark per step under the track in comp.slider.tick at border.hairline width - the tick-ruler ornament of visual-dna §4.12, which is decorative: the readout carries the meaning, and ticks are dropped rather than crowded when a step would fall closer than space.1 to its neighbour. `showsTicks: true` without a `step` draws nothing and is not an error; there is no ruler without stops."
  - "Keyboard: the arrow keys move one step, Home and End jump to `min` and `max`, and Page Up and Page Down move ten steps. A Slider with no `step` takes one hundredth of its range as the keyboard step (dataviz-design §3 rule 43, the scrubber's keyboard grammar). Every keyboard move fires `onChange` and then `onChangeEnd`, because a key press is a whole gesture."
  - "`showsValue` renders the current value beside the label as a Text of role metric-md with tabular figures and `unit` hung beside it; live values are tabular so the row does not jitter (visual-dna §4.2 and §11 anti-pattern 18). The readout is trailing in the label row and never wraps or truncates: the label takes the width that is left and wraps, so a long label grows the row downwards and the number keeps its place on the first line."
  - "While dragging, the same string is also drawn over the thumb, space.2 above the track, so a finger does not hide it. It is an addition, not a move - the readout in the label row stays where it is, nothing reflows, and under pointer modality, where nothing covers the thumb, the floating copy is not drawn at all."
  - On a vivid surface, and on the scheme's glass, the fill and the thumb become the white solid (color.bg.fill.inverse-media) and the unfilled track takes color.border.on-media or color.border.on-glass-fill.
  - Hover is pointer-only and draws a halo of color.bg.fill.neutral.subtle around the thumb, spreading the bound haloSpread (space.3) beyond it on every side; the same halo marks the dragging state on both modalities. Touch never shows a hover state (ADR-0010 rule 2).
  - "`isDisabled` lowers opacity to opacity.disabled, removes the control from the focus order and ignores drags; the value stays visible, because a disabled slider still reports what it holds."
  - The value does not animate while a finger or a pointer is on the thumb - the thumb tracks the gesture directly. A value changed from code settles on motion.spring.interactive, and a value replaced outright changes over motion.duration.quick.
  - One haptic per user action - on grab, on release, once per step crossed and once at each limit - and none on a programmatic change (the rules of the haptics registry).
  - A Slider is for a value the reader chooses. A value the system reports is a ProgressBar, and a position in time over a chart is a TimelineScrubber, which shares this thumb and this track.

motion:
  drag: motion.spring.interactive
  valueChange: motion.duration.quick
  reduceMotion: crossfade

haptics:
  grab: haptic.press.slider
  release: haptic.release.slider
  step: haptic.selection
  limit: haptic.selection.limit

accessibility:
  role: slider
  label: the `label` prop, or an explicit name when no label is visible; the control always reports a value, and the value is spoken with its unit ("42 percent") even when `showsValue` is false
  traits: [adjustable]
  keyboard: the thumb is the one tab stop; the arrow keys move one step, Home and End jump to the ends, Page Up and Page Down move ten steps; the focus ring is color.border.focus at border.focus width around the thumb's circle, following radius.control, and the thumb keeps its halo while focus is on it
  dynamicType: the label and the readout scale with type.label.md and type.metric.md and the row grows with them; the track and the thumb keep their token sizes, so the control never loses its geometry
  contrast: "comp.slider.track.bg aliases color.border.strong, whose boundary-tier pairs (3:1) against color.bg.page, color.bg.surface and color.bg.surface.raised are in tokens/contrast-pairs.json, so the unfilled range is legible on its own; the fill and the thumb are color.bg.fill.inverse, the scheme's opposite end, over those same three grounds, and color.bg.fill.inverse-media over media, whose pair with color.text.on-inverse-media is in the same file and whose note records the solid as V1 against every vivid sample (ADR-0030 §3.1). On vivid and on the scheme's glass the unfilled track takes color.border.on-media or color.border.on-glass-fill, which ADR-0030 §3.2 makes decorative - the white fill and the readout carry the value there, not the empty range. The value is never carried by the fill alone: the readout states it in text (ADR-0011)"
  reduceTransparency: not applicable (Slider draws no material of its own); when the enclosing Surface falls back from glass to raised, the media cells stop applying and the control renders its default cells
  reduceMotion: the thumb keeps tracking the gesture, which is movement inside an active gesture; a programmatic change moves the thumb on its bound spring, which does not overshoot, and the halo crossfades in over motion.duration.base with motion.easing.out instead of scaling. The readout never counts up (ADR-0023 §8.4)

usage:
  do:
    - Show the value as text beside the label; a slider without a readout is a guess.
    - Give a slider a step whenever the value is discrete, and let the haptic mark each step crossed.
    - Let the whole track be a target, so a reader can jump instead of drag.
  dont:
    - Don't use a Slider for a value the system reports; that is a ProgressBar.
    - Don't put two sliders on one row, and don't let a slider be the only place a precise value can be entered.
    - Don't color the fill with the accent or a status hue; the accent means attention, not action (visual-dna §11 anti-pattern 7).

examples:
  - id: continuous
    props: { value: 42, min: 0, max: 100, label: "Alert threshold", unit: "%" }
  - id: stepped-ticks
    props: { value: 6, min: 0, max: 12, step: 1, showsTicks: true, label: "Sampling window", unit: "h" }
  - id: at-minimum
    props: { value: 0, min: 0, max: 100, label: "Alert threshold", unit: "%" }
    description: the fill has no length and the thumb sits on the leading end of the track
  - id: dragging
    props: { value: 78, min: 0, max: 100, label: "Alert threshold", unit: "%" }
    description: the halo is drawn around the thumb; under touch the readout is also drawn over it, space.2 above the track
  - id: no-readout
    props: { value: 42, min: 0, max: 100, label: "Alert threshold", showsValue: false }
  - id: disabled
    props: { value: 42, min: 0, max: 100, label: "Alert threshold", unit: "%", isDisabled: true }
  - id: on-vivid
    props: { value: 64, min: 0, max: 100, label: "Target yield", unit: "%" }
    surface: vivid
  - id: on-glass-over-map
    props: { value: 30, min: 0, max: 60, step: 5, label: "Route window", unit: "min" }
    surface: glass
    backdrop: map
  - id: label-ru
    props: { value: 42, min: 0, max: 100, label: "Порог оповещения по линии розлива", unit: "%" }
    description: a long Russian label; it wraps above the track and the readout stays on the first line

notes:
  platform:
    watchos: "none. ADR-0010's Tier 3 list has no Slider: a value on the wrist is set with the Digital Crown against a system control, and a 4 px track with a 44 pt thumb would take a whole glanceable tile to hold one number."
    macos: "Hover is required and the thumb follows compact density (28 pt, which is also the pointer hit area). A stepped slider is silent on the desk: spec/haptics.yaml maps haptic.selection to none on macOS, and haptic.levelChange, the macOS-only entry, is a different id - a component declares one id per action and DSCore owns the per-platform mapping (haptics rule 1), so widening haptic.selection's macOS row is a registry change, not a component one. haptic.selection.limit does play there, as SensoryFeedback.alignment."
    web-desktop: Built on React Aria Slider; `data-dragging` and `data-focus-visible` drive the CSS states, and the thumb is a real focusable element so the arrow keys work without extra wiring (ADR-0019).
  design: >-
    docs/research/component-inventory.md records no Slider in the eleven shots and names the
    TimelineScrubber thumbs as the nearest sighting, with the note that the two share thumb and track
    tokens; this spec is written so they can. The fill is the inverse solid of
    docs/research/visual-dna.md §1 principle 9, the unfilled track is the meter rule of
    docs/research/dataviz-design.md §3 ("the unfilled track is a lighter step of the same ramp"), the
    ticks are the tick ruler of visual-dna §4.12, the keyboard grammar and the focusable thumb are
    dataviz-design §3 rule 43, and
    the tabular readout is §4.2 with §11 anti-pattern 18. The 4 px track height is the smallest step of
    the §6.1 rhythm - the references give no thickness of their own - and the 2x halo radius is stated
    as space.3 beyond the thumb rather than as a value. Example strings are invented (ADR-0015 rule 3).
  references: [docs/adr/0010-platform-tiers-density-modality.md, docs/adr/0011-accessibility-tiers-ci.md, docs/adr/0012-layers-and-v1-scope.md, docs/adr/0023-motion-tokens.md, docs/adr/0024-token-source-conventions.md, docs/adr/0029-direction-board-sign-off.md]
